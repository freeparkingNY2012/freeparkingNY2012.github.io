<!DOCTYPE html>
<html lang="en">

<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;margin:0;background-attachment:fixed;background-repeat:no-repeat;background-size:cover}
.fade{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slide{animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.streak-glow{animation:streakPulse .5s ease}
@keyframes streakPulse{0%{transform:scale(1.3);color:#fbbf24}100%{transform:scale(1)}}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#0f172a}
::-webkit-scrollbar-thumb{background:#4f46e5;border-radius:9px}
.no-scrollbar::-webkit-scrollbar{display:none}
</style>

<body class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 text-white min-h-screen">
<div id="app"></div>
<script>
// ═══════════════════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════════════════
const LS={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  clear(){localStorage.clear()}
};

let S=LS.get('scm_settings')||{
  showVosotros:true,
  showEnglish:true,
  quizSize:20,
  timedMode:false,
  timerSec:15,
  instantFeedback:true,
  fontSize:'normal',
  numChoices:12,
  uiScale:100
};
// Backfill for older saved settings
if (!S.numChoices || S.numChoices < 3) S.numChoices = 12;
if (!S.uiScale) S.uiScale = 100;
let P=LS.get('scm_progress')||{
  done:[],
  scores:{},
  ok:0,
  tot:0,
  streak:0,
  best:0,
  xp:0
};
const saveS=()=>LS.set('scm_settings',S);
const saveP=()=>LS.set('scm_progress',P);
const PASS_STREAK = 10;

// Force consistent pass requirement even if old settings exist.
if (S.passStreak !== undefined) {
  delete S.passStreak;
  saveS();
}

// ═══════════════════════════════════════════════════════════════════
//  PERSONS (6 conjugation groups for tables)
// ═══════════════════════════════════════════════════════════════════
const PERSONS=[
  {k:'yo',l:'Yo',e:'I'},
  {k:'tu',l:'Tú',e:'You (informal)'},
  {k:'el',l:'Él/Ella/Ud.',e:'He/She/You(formal)'},
  {k:'nos',l:'Nosotros',e:'We'},
  {k:'vos',l:'Vosotros',e:'You all (Spain)'},
  {k:'ellos',l:'Ellos/Uds.',e:'They/You all'},
];

// ═══════════════════════════════════════════════════════════════════
//  PRONOUNS (individual for quiz questions)
// ═══════════════════════════════════════════════════════════════════
const PRONOUNS=[
  {l:'Yo',e:'I',ck:'yo'},
  {l:'Tú',e:'You (informal)',ck:'tu'},
  {l:'Él',e:'He',ck:'el'},
  {l:'Ella',e:'She',ck:'el'},
  {l:'Usted',e:'You (formal)',ck:'el'},
  {l:'Nosotros',e:'We (masc/mixed)',ck:'nos'},

  {l:'Ustedes',e:'You all (formal)',ck:'ellos'},

const activePronouns=()=>S.showVosotros?PRONOUNS:PRONOUNS.filter(p=>!p.vosOnly);
const activePersons=()=>S.showVosotros?PERSONS:PERSONS.filter(p=>p.k!=='vos');

// ═══════════════════════════════════════════════════════════════════
//  TENSES (15 active)
// ═══════════════════════════════════════════════════════════════════
const TENSES=[
  // ── Present ──
  {id:'present',name:'Presente',cat:'Present',ord:1,
   desc:'Actions happening now, habits, general truths.'},
  {id:'pres_prog',name:'Presente Progresivo',cat:'Present',ord:2,
   desc:'Is doing right now. estar (present) + gerund.'},
  {id:'present_perfect',name:'Pretérito Perfecto',cat:'Present',ord:3,
   desc:'Have done. Recently completed actions.'},

  // ── Past ──
  {id:'preterit',name:'Pretérito',cat:'Past',ord:4,
   desc:'Completed past actions with clear start/end.'},
  {id:'imperfect',name:'Imperfecto',cat:'Past',ord:5,
   desc:'Ongoing/habitual past actions, descriptions.'},
  {id:'pluperfect',name:'Pluscuamperfecto',cat:'Past',ord:6,
   desc:'Had done. Past before another past action.'},
  {id:'past_prog',name:'Pasado Progresivo',cat:'Past',ord:7,
   desc:'Was doing. estar (imperfect) + gerund.'},

  // ── Future / Conditional ──
  {id:'future',name:'Futuro Simple',cat:'Future & Conditional',ord:8,
   desc:'Actions that will happen; probability.'},
  {id:'conditional',name:'Condicional',cat:'Future & Conditional',ord:9,
   desc:'Would do; polite requests, hypotheticals.'},
  {id:'future_perfect',name:'Futuro Perfecto',cat:'Future & Conditional',ord:10,
   desc:'Will have done by a certain point.'},

  // ── Commands ──
  {id:'aff_cmd',name:'Mandatos Afirmativos',cat:'Commands',ord:11,
   desc:'Commands TO DO something.'},
  {id:'neg_cmd',name:'Mandatos Negativos',cat:'Commands',ord:12,
   desc:'Commands NOT TO DO. Uses subjunctive.'},

  // ── Subjunctive ──
  {id:'pres_subj',name:'Presente de Subjuntivo',cat:'Subjunctive',ord:13,
   desc:'Wishes, doubts, emotions (present/future).'},
  {id:'perf_subj',name:'Perfecto de Subjuntivo',cat:'Subjunctive',ord:14,
   desc:'Have done (subjunctive). haya + participle.'},
];
const tenseById=id=>TENSES.find(t=>t.id===id);
const ACTIVE_IDS=new Set(TENSES.map(t=>t.id));

// Map old tense IDs from previous versions to current ones so imported saves work.
const TENSE_MIGRATION={
  'conditional_perfect':'conditional',  // rolled into conditional family
  'fut_prog':'future',
  'cond_prog':'conditional',
  'past_subj':'pres_subj',             // merged into subjunctive
  'ir_a_future':'future',
  'reflexive_present':'present',
  'reflexive_preterite':'preterit',
  'reflexive_commands':'aff_cmd',
  'reflexive_subjunctive':'pres_subj',
  'reflexive_progressive':'pres_prog',
};
function migrateProgress(){
  if(!P.done) return;
  // Migrate old tense IDs in done list
  P.done=P.done.map(id=>TENSE_MIGRATION[id]||id).filter(id=>ACTIVE_IDS.has(id));
  P.done=[...new Set(P.done)];
  // Migrate scores
  if(P.scores){
    const ns={};
    for(const[id,sc]of Object.entries(P.scores)){
      const mapped=TENSE_MIGRATION[id]||id;
      if(!ACTIVE_IDS.has(mapped)) continue;
      if(ns[mapped]){ns[mapped].ok+=sc.ok;ns[mapped].tot+=sc.tot;}
      else ns[mapped]={...sc};
    }
    P.scores=ns;
  }
  saveP();
}
migrateProgress();

// ═══════════════════════════════════════════════════════════════════
//  CUSTOM VERBS (TXT IMPORT)
// ═══════════════════════════════════════════════════════════════════
let CUSTOM_VERBS = LS.get('scm_custom_verbs') || {};
const saveCustomVerbs = () => LS.set('scm_custom_verbs', CUSTOM_VERBS);

function normalizeText(s) {
  return (s || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .toLowerCase();
}

function slugifyVerb(s) {
  return normalizeText(s)
    .replace(/[^a-z0-9\s_]/g, '')
    .trim()
    .replace(/\s+/g, '_')
    .replace(/_+/g, '_');
}

function inferTypeFromInf(inf) {
  if (/(ar|er|ir)$/.test(inf)) return inf.slice(-2);
  if (/(arse|erse|irse)$/.test(inf)) return inf.slice(-4, -2);
  return null;
}

function isGustarLikeInf(inf) {
  const n = normalizeText(inf);
  return [
    'gustar','encantar','disgustar','doler','aburrir','molestar','importar','fascinar',
    'dar igual','dar miedo','dar asco','caer bien','caer mal'
  ].some(x => n === x || n.startsWith(x + ' '));
}

function findVerbKeyByInf(inf) {
  const target = normalizeText(inf);
  for (const k of Object.keys(V)) {
    if (normalizeText(V[k].inf) === target) return k;
  }
  return null;
}

function buildVerbEntryFromInf(rawInf, rawEng) {
  const inf = rawInf.trim().toLowerCase();
  const eng = (rawEng || '').trim();
  if (!inf) return null;

  const parts = inf.split(/\s+/);
  const head = parts[0];
  const tail = parts.slice(1).join(' ').trim();

  const refl = /(arse|erse|irse)$/.test(head);
  const baseInf = refl ? head.slice(0, -2) : head;
  const tp = inferTypeFromInf(head) || inferTypeFromInf(baseInf);
  if (!tp) return null;

  const baseKey = findVerbKeyByInf(baseInf);

  const entry = {
    inf,
    eng,
    tp,
    custom: true,
    refl,
  };

  if (refl) {
    entry.base = baseInf;
    entry.headInf = baseInf;
  } else {
    entry.headInf = head;
  }

  if (tail) entry.phraseTail = tail;
  if (baseKey) entry.coreKey = baseKey;
  if (isGustarLikeInf(inf)) entry.gustarLike = true;

  return entry;
}

function customVerbRowsHtml() {
  const keys = Object.keys(CUSTOM_VERBS);
  if (!keys.length) return '<div class="text-[11px] text-slate-500">No imported verbs yet.</div>';
  return keys.slice(0, 120).map(k => {
    const v = CUSTOM_VERBS[k];
    return `<div class="py-2 border-b border-slate-700/30" data-cv="${k}">
      <div class="flex items-center justify-between gap-2">
        <div>
          <div class="text-xs text-slate-200"><strong>${v.inf}</strong> <span class="text-slate-500">(${v.tp})</span></div>
          <div class="text-[11px] text-slate-500">${v.eng || ''}</div>
        </div>
        <button data-action="removeCustomVerb" data-key="${k}" class="px-2 py-1 rounded bg-red-600/20 hover:bg-red-600/40 text-red-300 text-[11px]">Remove</button>
      </div>
      <label class="mt-1 flex items-center gap-2 text-[11px] text-slate-400">
        <input type="checkbox" class="custom-gustar accent-indigo-500" data-key="${k}" ${v.gustarLike ? 'checked' : ''}> Gustar-like behavior (me/te/le/nos/os/les + 3rd singular default)
      </label>
    </div>`;
  }).join('');
}

function addCustomVerbLine(line) {
  const clean = (line || '').trim();
  if (!clean || clean.startsWith('#')) return { added: false, reason: 'empty' };

  const sep = clean.indexOf(' - ');
  if (sep === -1) return { added: false, reason: 'format' };

  const inf = clean.slice(0, sep).trim();
  const eng = clean.slice(sep + 3).trim();
  const entry = buildVerbEntryFromInf(inf, eng);
  if (!entry) return { added: false, reason: 'unsupported' };

  let key = slugifyVerb(entry.inf);
  if (!key) return { added: false, reason: 'badkey' };
  if (V[key]) {
    let i = 2;
    while (V[`${key}_${i}`]) i++;
    key = `${key}_${i}`;
  }

  V[key] = entry;
  CUSTOM_VERBS[key] = entry;
  return { added: true, key };
}

function loadCustomVerbsIntoV() {
  for (const [k, v] of Object.entries(CUSTOM_VERBS)) {
    V[k] = v;
  }
}

loadCustomVerbsIntoV();

// ═══════════════════════════════════════════════════════════════════
//  CONJUGATION ENGINE
// ═══════════════════════════════════════════════════════════════════
const RP = {yo:'me',tu:'te',el:'se',nos:'nos',vos:'os',ellos:'se'};
const IOP = {yo:'me',tu:'te',el:'le',nos:'nos',vos:'os',ellos:'les'};

function stem(inf) {
  return inf.replace(/(arse|erse|irse|árse|érse|írse|ar|er|ir|ár|ér|ír)$/, '');
}

function futureCondBase(inf) {
  // Verbs like reír/sonreír/freír/oír lose written accent in future/conditional base.
  return inf.replace(/([áéí])r$/, (_, v) => ({'á':'a','é':'e','í':'i'}[v] + 'r'));
}

function getBaseKey(vk) {
  const v = V[vk];
  if (v && v.refl && v.base) return v.base;
  return vk;
}

function getIrregTable(vk) {
  const baseKey = getBaseKey(vk);
  return IRREG_TABLES[baseKey] || null;
}

// Apply boot stem change (yo, tu, el, ellos only)
function bootSC(s, type, p) {
  if (!['yo','tu','el','ellos'].includes(p)) return s;
  if (type === 'e:ie') return s.replace(/(.*)e/, '$1ie');
  if (type === 'o:ue') return s.replace(/(.*)o/, '$1ue');
  if (type === 'e:i') return s.replace(/(.*)e/, '$1i');
  if (type === 'u:ue') return s.replace(/(.*)u/, '$1ue');
  return s;
}

// Spelling change for preterit yo
function spPretYo(s, sp) {
  if (sp === 'car') return s.replace(/c$/, 'qu');
  if (sp === 'gar') return s.replace(/g$/, 'gu');
  if (sp === 'zar') return s.replace(/z$/, 'c');
  return s;
}

// Spelling change for subjunctive (all persons)
function spSubj(s, sp) {
  if (sp === 'car') return s.replace(/c$/, 'qu');
  if (sp === 'gar') return s.replace(/g$/, 'gu');
  if (sp === 'zar') return s.replace(/z$/, 'c');
  if (sp === 'ger') return s.replace(/g$/, 'j');
  if (sp === 'gir') return s.replace(/g$/, 'j');
  return s;
}

// Get gerund
function gerund(vk) {
  const v = V[vk];
  if (v && v.phraseTail && v.coreKey) {
    const coreG = gerund(v.coreKey);
    return coreG ? `${coreG} ${v.phraseTail}` : null;
  }
  const it = getIrregTable(vk);
  if (it && it.gerund) return it.gerund;
  if (v && v.refl) {
    const baseIt = IRREG_TABLES[v.base];
    if (baseIt && baseIt.gerund) return baseIt.gerund;
  }
  const baseKey = getBaseKey(vk);
  const baseInf = V[baseKey]?.inf || v?.inf || vk;
  const s = stem(baseInf);
  const tp = v?.tp || 'ar';
  if (tp === 'ar') return s + 'ando';
  return s + 'iendo';
}

// Get past participle
function pp(vk) {
  const v = V[vk];
  if (v && v.phraseTail && v.coreKey) {
    const corePp = pp(v.coreKey);
    return corePp ? `${corePp} ${v.phraseTail}` : null;
  }
  const it = getIrregTable(vk);
  if (it && it.pp) return it.pp;
  if (v && v.pp) return v.pp;
  if (v && v.refl) {
    const baseIt = IRREG_TABLES[v.base];
    if (baseIt && baseIt.pp) return baseIt.pp;
    const baseV = V[v.base];
    if (baseV && baseV.pp) return baseV.pp;
  }
  const baseKey = getBaseKey(vk);
  const baseInf = V[baseKey]?.inf || v?.inf || vk;
  const s = stem(baseInf);
  const tp = v?.tp || 'ar';
  if (tp === 'ar') return s + 'ado';
  return s + 'ido';
}

// HABER forms
const HABER = {
  pres: {yo:'he',tu:'has',el:'ha',nos:'hemos',vos:'habéis',ellos:'han'},
  imp: {yo:'había',tu:'habías',el:'había',nos:'habíamos',vos:'habíais',ellos:'habían'},
  fut: {yo:'habré',tu:'habrás',el:'habrá',nos:'habremos',vos:'habréis',ellos:'habrán'},
  cond: {yo:'habría',tu:'habrías',el:'habría',nos:'habríamos',vos:'habríais',ellos:'habrían'},
  subj: {yo:'haya',tu:'hayas',el:'haya',nos:'hayamos',vos:'hayáis',ellos:'hayan'},
};

// ESTAR forms
const ESTAR = {
  pres: {yo:'estoy',tu:'estás',el:'está',nos:'estamos',vos:'estáis',ellos:'están'},
  imp: {yo:'estaba',tu:'estabas',el:'estaba',nos:'estábamos',vos:'estabais',ellos:'estaban'},
  fut: {yo:'estaré',tu:'estarás',el:'estará',nos:'estaremos',vos:'estaréis',ellos:'estarán'},
  cond: {yo:'estaría',tu:'estarías',el:'estaría',nos:'estaríamos',vos:'estaríais',ellos:'estarían'},
};

// IR forms for "ir a + inf"
const IR_PRES = {yo:'voy',tu:'vas',el:'va',nos:'vamos',vos:'vais',ellos:'van'};

// ═══════════════════════════════════════════════════════════════════
//  MAIN CONJUGATION FUNCTION
// ═══════════════════════════════════════════════════════════════════
function conj(vk, tense, p, opts = {}) {
  const v = V[vk];
  if (!v) return null;

  // Gustar-like logic: indirect pronoun + typically 3rd singular verb form.
  if (!opts.skipGustar && v.gustarLike) {
    const io = IOP[p] || 'le';
    if (v.phraseTail && v.coreKey) {
      const core = conj(v.coreKey, tense, 'el', { skipGustar: true });
      if (!core) return null;
      return `${io} ${core} ${v.phraseTail}`;
    }
    const base = conj(vk, tense, 'el', { skipGustar: true });
    if (!base) return null;
    return `${io} ${base}`;
  }

  // Phrase verbs like "caer bien", "dar miedo": conjugate core verb, append tail.
  if (v.phraseTail && v.coreKey && v.coreKey !== vk) {
    const core = conj(v.coreKey, tense, p, opts);
    if (!core) return null;
    return `${core} ${v.phraseTail}`;
  }

  // Imported alias verbs like custom "caber" should reuse known robust tables.
  if (!v.refl && !v.phraseTail && v.coreKey && v.coreKey !== vk) {
    return conj(v.coreKey, tense, p, opts);
  }
  
  const refl = v.refl;
  const rp = refl ? RP[p] : '';
  const pre = (f) => refl ? (rp + ' ' + f) : f;
  
  const baseKey = getBaseKey(vk);
  const it = getIrregTable(vk);
  const baseInf = refl ? v.base : (v.headInf || v.inf);
  const s = stem(baseInf);
  const tp = v.tp;

  // ─── COMPOUND TENSES (haber + pp) ───
  if (tense === 'present_perfect') return pre(HABER.pres[p] + ' ' + pp(vk));
  if (tense === 'pluperfect') return pre(HABER.imp[p] + ' ' + pp(vk));
  if (tense === 'future_perfect') return pre(HABER.fut[p] + ' ' + pp(vk));
  if (tense === 'conditional_perfect') return pre(HABER.cond[p] + ' ' + pp(vk));
  if (tense === 'perf_subj') return pre(HABER.subj[p] + ' ' + pp(vk));

  // ─── PROGRESSIVE TENSES (estar + gerund) ───
  const g = gerund(vk);
  if (tense === 'pres_prog') return refl ? (rp + ' ' + ESTAR.pres[p] + ' ' + g) : (ESTAR.pres[p] + ' ' + g);
  if (tense === 'past_prog') return refl ? (rp + ' ' + ESTAR.imp[p] + ' ' + g) : (ESTAR.imp[p] + ' ' + g);
  if (tense === 'fut_prog') return refl ? (rp + ' ' + ESTAR.fut[p] + ' ' + g) : (ESTAR.fut[p] + ' ' + g);
  if (tense === 'cond_prog') return refl ? (rp + ' ' + ESTAR.cond[p] + ' ' + g) : (ESTAR.cond[p] + ' ' + g);

  // ─── IR A + INFINITIVE ───
  if (tense === 'ir_a_future') {
    const inf = refl ? v.base : v.inf;
    return refl ? (rp + ' ' + IR_PRES[p] + ' a ' + inf) : (IR_PRES[p] + ' a ' + inf);
  }

  // ─── CHECK IRREG TABLE FIRST ───
  if (it && it[tense] && it[tense][p] !== undefined) {
    return pre(it[tense][p]);
  }

  // ─── NEGATIVE COMMANDS (no + subjunctive) ───
  if (tense === 'neg_cmd') {
    if (p === 'yo') return null;
    const subjForm = conj(vk, 'pres_subj', p, opts);
    if (!subjForm) return null;
    if (refl) {
      const stripped = subjForm.replace(/^(me|te|se|nos|os)\s+/, '');
      return 'no ' + rp + ' ' + stripped;
    }
    return 'no ' + subjForm;
  }

  // ─── AFFIRMATIVE COMMANDS ───
  if (tense === 'aff_cmd') {
    if (p === 'yo') return null;
    
    // Check irreg table
    if (it && it.aff_cmd && it.aff_cmd[p]) {
      const cmd = it.aff_cmd[p];
      if (refl) return attachPronoun(cmd, p);
      return cmd;
    }
    
    // tú: use él present indicative
    if (p === 'tu') {
      const elForm = conj(vk, 'present', 'el', opts);
      if (!elForm) return null;
      const cmd = refl ? elForm.replace(/^se\s+/, '') : elForm;
      if (refl) return attachPronoun(cmd, p);
      return cmd;
    }
    
    // vosotros: inf drop -r, add -d
    if (p === 'vos') {
      if (refl) {
        // vestirse → vestíos, lavarse → lavaos
        if (tp === 'ir') return s + 'íos';
        return s + 'aos';
      }
      return baseInf.slice(0, -1) + 'd';
    }
    
    // usted, nosotros, ustedes: subjunctive
    const subjForm = conj(vk, 'pres_subj', p, opts);
    if (!subjForm) return null;
    if (refl) {
      const stripped = subjForm.replace(/^(me|te|se|nos|os)\s+/, '');
      if (p === 'nos') {
        // drop final -s before adding -nos
        return addAccent(stripped.replace(/s$/, '')) + 'nos';
      }
      return stripped + RP[p];
    }
    return subjForm;
  }

  // ─── PAST SUBJUNCTIVE (from preterit ellos) ───
  if (tense === 'past_subj') {
    // Check irreg table first
    if (it && it.past_subj && it.past_subj[p]) {
      return pre(it.past_subj[p]);
    }
    
    // Derive from preterit ellos
    let ellosForm = conj(vk, 'preterit', 'ellos', opts);
    if (!ellosForm) return null;
    if (refl) ellosForm = ellosForm.replace(/^se\s+/, '');
    
    const base = ellosForm.replace(/ron$/, '');
    const endings = {yo:'ra',tu:'ras',el:'ra',nos:'ramos',vos:'rais',ellos:'ran'};
    let form = base + endings[p];
    
    // nosotros needs accent
    if (p === 'nos') {
      const idx = form.lastIndexOf('ramos');
      if (idx > 0) {
        const ch = form[idx-1];
        const acc = {a:'á',e:'é',i:'í',o:'ó',u:'ú'};
        if (acc[ch]) form = form.substring(0,idx-1) + acc[ch] + form.substring(idx);
      }
    }
    return pre(form);
  }

  // ─── PRESENT ───
  if (tense === 'present') {
    let st = s;
    if (v.sc) st = bootSC(s, v.sc, p);
    
    const arE = {yo:'o',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'};
    const erE = {yo:'o',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'};
    const irE = {yo:'o',tu:'es',el:'e',nos:'imos',vos:'ís',ellos:'en'};
    const e = tp === 'ar' ? arE : tp === 'er' ? erE : irE;
    
    return pre(st + e[p]);
  }

  // ─── PRETERIT ───
  if (tense === 'preterit') {
    let st = s;
    
    // Spelling change for yo
    if (v.sp && p === 'yo') st = spPretYo(s, v.sp);
    
    const arE = {yo:'é',tu:'aste',el:'ó',nos:'amos',vos:'asteis',ellos:'aron'};
    const erIrE = {yo:'í',tu:'iste',el:'ió',nos:'imos',vos:'isteis',ellos:'ieron'};
    const e = tp === 'ar' ? arE : erIrE;
    
    return pre(st + e[p]);
  }

  // ─── IMPERFECT ───
  if (tense === 'imperfect') {
    const arE = {yo:'aba',tu:'abas',el:'aba',nos:'ábamos',vos:'abais',ellos:'aban'};
    const erIrE = {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'};
    const e = tp === 'ar' ? arE : erIrE;
    return pre(s + e[p]);
  }

  // ─── FUTURE ───
  if (tense === 'future') {
    const futStem = (it && it.futStem) ? it.futStem : futureCondBase(baseInf);
    const e = {yo:'é',tu:'ás',el:'á',nos:'emos',vos:'éis',ellos:'án'};
    return pre(futStem + e[p]);
  }

  // ─── CONDITIONAL ───
  if (tense === 'conditional') {
    const condStem = (it && it.futStem) ? it.futStem : futureCondBase(baseInf);
    const e = {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'};
    return pre(condStem + e[p]);
  }

  // ─── PRESENT SUBJUNCTIVE ───
  if (tense === 'pres_subj') {
    let st = s;
    
    // Apply stem change
    if (v.sc) st = bootSC(s, v.sc, p);
    
    // Spelling change
    if (v.sp) st = spSubj(st, v.sp);
    
    // Opposite endings
    const arE = {yo:'e',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'};
    const erIrE = {yo:'a',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'};
    const e = tp === 'ar' ? arE : erIrE;
    
    return pre(st + e[p]);
  }

  return null;
}

// Helper: attach reflexive pronoun to command with accent
function attachPronoun(cmd, p) {
  const pro = {yo:'me',tu:'te',el:'se',nos:'nos',vos:'os',ellos:'se'}[p];
  return addAccent(cmd) + pro;
}

function addAccent(word) {
  const vowels = 'aeiou';
  const accents = {a:'á',e:'é',i:'í',o:'ó',u:'ú'};
  // Find last vowel and add accent
  for (let i = word.length - 1; i >= 0; i--) {
    if (vowels.includes(word[i])) {
      return word.substring(0, i) + accents[word[i]] + word.substring(i + 1);
    }
  }
  return word;
}

// ═══════════════════════════════════════════════════════════════════
//  VALIDATION: Check conjugation output
// ═══════════════════════════════════════════════════════════════════
function isValidConj(form) {
  if (!form) return false;
  if (typeof form !== 'string') return false;
  if (form.length < 2) return false;
  if (form.includes('undefined') || form.includes('null')) return false;
  if (form.includes('NaN')) return false;
  // Check for duplicate accents or weird patterns
  if (/[áéíóú]{2,}/.test(form)) return false;
  // Catch known malformed outputs (e.g., accidental doubled tense chunks)
  if (/ri{i,2}r/i.test(form) || /íriá|írí|íri/i.test(form)) return false;
  // Check for impossible letter combos
  if (/[A-Z]/.test(form.slice(1))) return false; // capitals in middle
  return true;
}

// ═══════════════════════════════════════════════════════════════════
//  DISTRACTOR GENERATION
// ═══════════════════════════════════════════════════════════════════
function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = Math.random() * (i + 1) | 0;
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

function distractors(vk, tense, p, correct, n = 11, profile = 'single', quizTenses = []) {
  const v = V[vk];
  if (!v) return Array.from({length:n},(_,i)=>correct+i);
  const hard = [];   // most deceptive — shown first
  const medium = []; // plausible
  const soft = [];   // fallback

  const pool = new Set([correct]); // track everything we've seen
  const add = (bucket, form) => {
    if (!form || typeof form !== 'string') return;
    if (!isValidConj(form)) return;
    if (pool.has(form)) return;
    pool.add(form);
    bucket.push(form);
  };

  const vKeys = Object.keys(V).filter(k => k !== vk);
  const baseKey = v.refl ? v.base : (v.headInf || v.inf);
  const it = getIrregTable(vk);

  // ══════════════════════════════════════════════════════════════
  // TIER 1 — HARD: These are the traps students actually fall for
  // ══════════════════════════════════════════════════════════════

  // 1a) Wrong person, same verb & tense (confusing él/ellos, tú/yo, etc.)
  for (const pp of PERSONS) {
    if (pp.k === p) continue;
    try { add(hard, conj(vk, tense, pp.k)); } catch {}
  }

  // 1b) Closely related tense (present↔subjunctive, preterit↔imperfect, etc.)
  const relatedMap = {
    present:['pres_subj','aff_cmd','neg_cmd','pres_prog','present_perfect'],
    preterit:['imperfect','pluperfect','present_perfect'],
    imperfect:['preterit','pluperfect','past_prog','conditional'],
    future:['conditional','future_perfect','present'],
    conditional:['future','imperfect'],
    pres_subj:['present','neg_cmd','aff_cmd','perf_subj'],
    aff_cmd:['neg_cmd','pres_subj','present'],
    neg_cmd:['aff_cmd','pres_subj','present'],
    pres_prog:['past_prog','present','present_perfect'],
    past_prog:['pres_prog','imperfect','preterit'],
    present_perfect:['pluperfect','future_perfect','perf_subj','preterit'],
    pluperfect:['present_perfect','preterit','imperfect'],
    future_perfect:['present_perfect','future','conditional'],
    perf_subj:['present_perfect','pres_subj','pluperfect'],
  };
  (relatedMap[tense] || []).forEach(tid => {
    try { add(hard, conj(vk, tid, p)); } catch {}
  });

  // 1c) Stem-change traps: apply WRONG stem change or NO stem change
  if (v.sc && ['present','pres_subj','aff_cmd'].includes(tense)) {
    const s = correct;
    // If correct has stem change, offer the un-changed version
    const unchanged = s.replace(/ue/g,'o').replace(/ie/g,'e').replace(/(?<=[^aeiouáéíóú])i(?=[^aeiouáéíóú])/,'e');
    add(hard, unchanged);
    // Apply wrong stem change type
    add(hard, s.replace(/ie/g,'i'));    // e:ie → e:i confusion
    add(hard, s.replace(/ue/g,'u'));    // o:ue → o:u confusion
    add(hard, s.replace(/ue/g,'ie'));   // o:ue → e:ie crossover
    add(hard, s.replace(/ie/g,'ue'));   // e:ie → o:ue crossover
  }

  // 1d) Irregular vs regular confusion: conjugate as if the verb were regular
  if (v.irreg || it) {
    // Build what a REGULAR verb with same ending would produce
    const regStem = baseKey.replace(/(ar|er|ir)$/, '');
    const tp = v.tp;
    const regEndings = {
      present: tp==='ar' ? {yo:'o',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'}
             : tp==='er' ? {yo:'o',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'}
             :             {yo:'o',tu:'es',el:'e',nos:'imos',vos:'ís',ellos:'en'},
      preterit: tp==='ar' ? {yo:'é',tu:'aste',el:'ó',nos:'amos',vos:'asteis',ellos:'aron'}
             :              {yo:'í',tu:'iste',el:'ió',nos:'imos',vos:'isteis',ellos:'ieron'},
      imperfect: tp==='ar' ? {yo:'aba',tu:'abas',el:'aba',nos:'ábamos',vos:'abais',ellos:'aban'}
             :               {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'},
    };
    if (regEndings[tense] && regEndings[tense][p]) {
      const fakeRegular = (v.refl ? RP[p]+' ' : '') + regStem + regEndings[tense][p];
      add(hard, fakeRegular);
    }
    // Future/conditional: use full infinitive (regular) vs irregular stem
    if ((tense === 'future' || tense === 'conditional') && it?.futStem) {
      const futE = {yo:'é',tu:'ás',el:'á',nos:'emos',vos:'éis',ellos:'án'};
      const condE = {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'};
      const e = tense === 'future' ? futE : condE;
      const regFut = (v.refl ? RP[p]+' ' : '') + baseKey + e[p];
      add(hard, regFut);
    }
    // Subjunctive: use regular stem instead of irregular yo-derived stem
    if (tense === 'pres_subj' && it?.present?.yo) {
      const regStem2 = baseKey.replace(/(ar|er|ir)$/, '');
      const subjE = tp==='ar' ? {yo:'e',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'}
                               : {yo:'a',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'};
      if (subjE[p]) add(hard, (v.refl ? RP[p]+' ' : '') + regStem2 + subjE[p]);
    }
  }

  // 1e) Wrong ending type: -AR endings on -ER verb, etc.
  if (['present','pres_subj'].includes(tense)) {
    const wrongEndingsPresent = v.tp==='ar'
      ? {yo:'o',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'}
      : {yo:'o',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'};
    const regStem3 = baseKey.replace(/(ar|er|ir)$/, '');
    if (wrongEndingsPresent[p]) add(hard, (v.refl ? RP[p]+' ' : '') + regStem3 + wrongEndingsPresent[p]);
  }

  // 1f) Preterit -AR vs -ER/-IR ending swap
  if (tense === 'preterit') {
    const s = baseKey.replace(/(ar|er|ir)$/, '');
    const wrongPretE = v.tp==='ar'
      ? {yo:'í',tu:'iste',el:'ió',nos:'imos',vos:'isteis',ellos:'ieron'}
      : {yo:'é',tu:'aste',el:'ó',nos:'amos',vos:'asteis',ellos:'aron'};
    if (wrongPretE[p]) add(hard, (v.refl ? RP[p]+' ' : '') + s + wrongPretE[p]);
  }

  // 1g) Command confusion: subjunctive form where indicative is needed and vice versa
  if (tense === 'aff_cmd' && p === 'tu') {
    // Offer the subjunctive tú form (common mistake)
    try { add(hard, conj(vk, 'pres_subj', 'tu')); } catch {}
    // Offer the present yo form (another common mistake)
    try { add(hard, conj(vk, 'present', 'yo')); } catch {}
  }
  if (tense === 'neg_cmd') {
    // Offer the affirmative command form (forgetting 'no')
    try { add(hard, conj(vk, 'aff_cmd', p)); } catch {}
    // Offer the neg command without 'no'
    add(hard, correct.replace(/^no\s+/, ''));
  }

  // 1h) Reflexive traps
  if (v.refl) {
    // Drop pronoun entirely
    add(hard, correct.replace(/^(me|te|se|nos|os)\s+/, ''));
    // Wrong pronoun
    const wrongPro = ['me','te','se','nos','os','se'].filter(x => x !== RP[p]);
    wrongPro.forEach(wp => add(medium, correct.replace(/^(me|te|se|nos|os)/, wp)));
  } else {
    // Add a reflexive pronoun where none should exist
    add(medium, `${RP[p]} ${correct}`);
  }

  // 1i) Irregular past participle traps (for compound tenses)
  if (['present_perfect','pluperfect','future_perfect','perf_subj'].includes(tense)) {
    const realPP = pp(vk);
    // Offer regular participle if verb has irregular one
    const regPP = v.tp === 'ar' ? baseKey.replace(/(ar)$/, 'ado') : baseKey.replace(/(er|ir)$/, 'ido');
    if (regPP !== realPP) {
      add(hard, correct.replace(realPP, regPP));
    }
    // Offer a common wrong irregular participle
    const ppSwaps = {abierto:'abrido',dicho:'decido',escrito:'escribido',hecho:'hacido',muerto:'morido',puesto:'ponido',visto:'veído',vuelto:'volvido',roto:'rompido',frito:'freído'};
    if (ppSwaps[realPP]) add(hard, correct.replace(realPP, ppSwaps[realPP]));
  }

  // 1j) Progressive tense traps (wrong gerund)
  if (['pres_prog','past_prog'].includes(tense)) {
    const realG = gerund(vk);
    // Regular gerund where irregular is needed
    const regG = v.tp === 'ar' ? baseKey.replace(/(ar)$/, 'ando') : baseKey.replace(/(er|ir)$/, 'iendo');
    if (regG !== realG) add(hard, correct.replace(realG, regG));
    // Common gerund mistakes
    const gSwaps = {diciendo:'deciendo',durmiendo:'dormiendo',pidiendo:'pediendo',
      sirviendo:'serviendo',siguiendo:'seguiendo',viniendo:'veniendo',
      muriendo:'moriendo',sintiendo:'sentiendo',vistiendo:'vestiendo',
      mintiendo:'mentiendo',leyendo:'leendo',oyendo:'oiendo',
      construyendo:'construiendo',yendo:'iendo',pudiendo:'podiendo'};
    if (gSwaps[realG]) add(hard, correct.replace(realG, gSwaps[realG]));
    // Wrong estar form (present vs imperfect swap)
    if (tense === 'pres_prog') {
      try { add(hard, conj(vk, 'past_prog', p)); } catch {}
    } else {
      try { add(hard, conj(vk, 'pres_prog', p)); } catch {}
    }
  }

  // 1k) Haber helper confusion in compound tenses
  if (['present_perfect','pluperfect','future_perfect','perf_subj'].includes(tense)) {
    const realPP2 = pp(vk);
    // Wrong haber tense (he vs había vs habré vs haya swap)
    const haberSets = {
      present_perfect: ['pluperfect','future_perfect','perf_subj'],
      pluperfect: ['present_perfect','future_perfect','perf_subj'],
      future_perfect: ['present_perfect','pluperfect','perf_subj'],
      perf_subj: ['present_perfect','pluperfect','future_perfect'],
    };
    (haberSets[tense]||[]).forEach(otherT => {
      try { add(hard, conj(vk, otherT, p)); } catch {}
    });
    // Wrong haber person with correct participle (has hablado vs he hablado)
    for (const pp3 of PERSONS) {
      if (pp3.k === p) continue;
      try { add(hard, conj(vk, tense, pp3.k)); } catch {}
    }
  }

  // 1l) Ser vs Estar confusion (when verb is one of them)
  if (vk === 'ser' || vk === 'estar' || (v.base === 'ser') || (v.base === 'estar')) {
    const other = (vk === 'ser' || v.base === 'ser') ? 'estar' : 'ser';
    try { add(hard, conj(other, tense, p)); } catch {}
  }

  // 1m) Saber vs Conocer confusion
  if (vk === 'saber' || vk === 'conocer') {
    const other = vk === 'saber' ? 'conocer' : 'saber';
    try { add(hard, conj(other, tense, p)); } catch {}
  }

  // 1n) Preterit vs imperfect of SAME verb (classic confusion)
  if (tense === 'preterit' || tense === 'imperfect') {
    const other = tense === 'preterit' ? 'imperfect' : 'preterit';
    try { add(hard, conj(vk, other, p)); } catch {}
    // Also neighboring person in the other tense
    for (const pp4 of PERSONS) {
      if (pp4.k === p) continue;
      try { add(medium, conj(vk, other, pp4.k)); } catch {}
    }
  }

  // 1o) Boot-shape confusion: apply stem change where it shouldn't (nos/vos)
  if (v.sc && ['nos','vos'].includes(p) && ['present','pres_subj'].includes(tense)) {
    // Offer the WRONG stem-changed form for nosotros/vosotros
    const wrongStem = baseKey.replace(/(ar|er|ir)$/, '');
    const changed = wrongStem.replace(/(.*)e/, '$1ie').replace(/(.*)o/, '$1ue');
    if (changed !== wrongStem) {
      const tp2 = v.tp;
      if (tense === 'present') {
        const e = tp2==='ar' ? {nos:'amos',vos:'áis'} : tp2==='er' ? {nos:'emos',vos:'éis'} : {nos:'imos',vos:'ís'};
        add(hard, (v.refl ? RP[p]+' ' : '') + changed + (e[p]||''));
      }
    }
  }
  // And the reverse: for boot persons, offer the UN-changed form
  if (v.sc && ['yo','tu','el','ellos'].includes(p) && ['present','pres_subj'].includes(tense)) {
    const plainStem = baseKey.replace(/(ar|er|ir)$/, '');
    const tp2 = v.tp;
    if (tense === 'present') {
      const e = tp2==='ar' ? {yo:'o',tu:'as',el:'a',ellos:'an'} : tp2==='er' ? {yo:'o',tu:'es',el:'e',ellos:'en'} : {yo:'o',tu:'es',el:'e',ellos:'en'};
      add(hard, (v.refl ? RP[p]+' ' : '') + plainStem + (e[p]||''));
    }
  }

  // 1p) Future/conditional stem confusion (irregular stem vs regular infinitive, or wrong irregular stem)
  if ((tense === 'future' || tense === 'conditional') && it?.futStem) {
    // Offer another verb's irregular future stem with this verb's endings
    const otherFutVerbs = ['tener','venir','poner','salir','hacer','decir','poder','saber','querer','caber','valer','haber']
      .filter(k => k !== vk && IRREG_TABLES[k]?.futStem);
    for (let i = 0; i < 3 && i < otherFutVerbs.length; i++) {
      const rk = otherFutVerbs[Math.random() * otherFutVerbs.length | 0];
      try { add(medium, conj(rk, tense, p)); } catch {}
    }
  }

  // 1q) Imperfect -aba vs -ía confusion (wrong family endings)
  if (tense === 'imperfect') {
    const wrongImpStem = baseKey.replace(/(ar|er|ir)$/, '');
    if (v.tp === 'ar') {
      // offer -ía endings on -ar verb
      const wrongE = {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'};
      add(hard, (v.refl ? RP[p]+' ' : '') + wrongImpStem + wrongE[p]);
    } else {
      // offer -aba endings on -er/-ir verb
      const wrongE = {yo:'aba',tu:'abas',el:'aba',nos:'ábamos',vos:'abais',ellos:'aban'};
      add(hard, (v.refl ? RP[p]+' ' : '') + wrongImpStem + wrongE[p]);
    }
  }

  // 1r) "Almost right" irregular preterit stems — swap one letter in the stem
  if (tense === 'preterit' && it?.preterit) {
    const irregStems = {
      tuv:'tov',estuv:'estov',pud:'pod',pus:'pos',sup:'sop',
      hic:'hec',hiz:'hez',quis:'ques',vin:'ven',dij:'dec',
      traj:'trej',conduj:'conduc',produj:'produc',traduj:'traduc',
      vin:'von',cup:'cop',di:'da'
    };
    const realForm = it.preterit[p];
    if (realForm) {
      for (const [from,to] of Object.entries(irregStems)) {
        if (realForm.includes(from)) {
          add(hard, realForm.replace(from, to));
        }
      }
    }
  }

  // 1s) Yo-go form leaking into wrong tenses (students use "tengo" stem everywhere)
  if (it?.present?.yo && tense !== 'present' && tense !== 'pres_subj') {
    const goStem = it.present.yo.replace(/o$/, '');
    const tp2 = v.tp;
    if (tense === 'preterit') {
      const e = tp2==='ar' ? {yo:'é',tu:'aste',el:'ó',nos:'amos',vos:'asteis',ellos:'aron'}
                            : {yo:'í',tu:'iste',el:'ió',nos:'imos',vos:'isteis',ellos:'ieron'};
      if (e[p]) add(hard, (v.refl?RP[p]+' ':'') + goStem + e[p]);
    }
    if (tense === 'imperfect') {
      const e = tp2==='ar' ? {yo:'aba',tu:'abas',el:'aba',nos:'ábamos',vos:'abais',ellos:'aban'}
                            : {yo:'ía',tu:'ías',el:'ía',nos:'íamos',vos:'íais',ellos:'ían'};
      if (e[p]) add(hard, (v.refl?RP[p]+' ':'') + goStem + e[p]);
    }
  }

  // 1t) Present perfect vs preterit confusion (he hablado vs hablé)
  if (tense === 'present_perfect') {
    try { add(hard, conj(vk, 'preterit', p)); } catch {}
  }
  if (tense === 'preterit') {
    try { add(hard, conj(vk, 'present_perfect', p)); } catch {}
  }

  // 1u) Conditional vs imperfect confusion (hablaría vs hablaba — both translate "would" in some contexts)
  if (tense === 'conditional') {
    try { add(hard, conj(vk, 'imperfect', p)); } catch {}
  }
  if (tense === 'imperfect') {
    try { add(hard, conj(vk, 'conditional', p)); } catch {}
  }

  // 1v) Subjunctive present vs indicative present confusion (hable vs habla)
  if (tense === 'pres_subj') {
    try { add(hard, conj(vk, 'present', p)); } catch {}
    // Also offer with wrong subjunctive endings (ar-subj on er-verb)
    const wrongSubjStem = baseKey.replace(/(ar|er|ir)$/, '');
    const wrongSubjE = v.tp==='ar'
      ? {yo:'a',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'}
      : {yo:'e',tu:'es',el:'e',nos:'emos',vos:'éis',ellos:'en'};
    if (wrongSubjE[p]) add(hard, (v.refl?RP[p]+' ':'') + wrongSubjStem + wrongSubjE[p]);
  }

  // 1w) Nosotros preterit vs present confusion (hablamos = same form!)
  // For -AR and -IR verbs, present and preterit nosotros look identical — offer the OTHER tense's
  // neighboring person to create confusion about which tense this "amos/imos" belongs to
  if ((tense === 'present' || tense === 'preterit') && (p === 'nos') && (v.tp === 'ar' || v.tp === 'ir')) {
    const other = tense === 'present' ? 'preterit' : 'present';
    for (const pp5 of PERSONS) {
      if (pp5.k === 'nos') continue;
      try { add(medium, conj(vk, other, pp5.k)); } catch {}
    }
  }

  // 1x) Double-accent or accent-shift errors on compound forms
  if (['present_perfect','pluperfect','future_perfect','perf_subj'].includes(tense)) {
    // Move accent from haber to participle or vice versa
    const parts = correct.split(' ');
    if (parts.length >= 2) {
      // Remove accent from haber part
      const deacc = w => w.replace(/[áéíóú]/g, m => ({á:'a',é:'e',í:'i',ó:'o',ú:'u'})[m]||m);
      add(medium, deacc(parts[0]) + ' ' + parts.slice(1).join(' '));
      // Add accent to participle
      const lastWord = parts[parts.length-1];
      if (lastWord.endsWith('ado')) add(medium, parts.slice(0,-1).join(' ') + ' ' + lastWord.replace(/ado$/, 'ádo'));
      if (lastWord.endsWith('ido')) add(medium, parts.slice(0,-1).join(' ') + ' ' + lastWord.replace(/ido$/, 'ído'));
    }
  }

  // 1y) Commands: infinitive used as command (very common beginner mistake)
  if (tense === 'aff_cmd') {
    add(hard, (v.refl ? RP[p]+' ' : '') + baseKey); // "hablar" instead of "habla"
    // Present tense yo form used as command
    try { add(hard, conj(vk, 'present', 'yo')); } catch {}
  }

  // 1z) Progressive: using present instead of estar+gerund
  if (tense === 'pres_prog') {
    try { add(hard, conj(vk, 'present', p)); } catch {}
  }
  if (tense === 'past_prog') {
    try { add(hard, conj(vk, 'imperfect', p)); } catch {}
  }

  // 1aa) Wrong auxiliary verb: ser/estar instead of haber in compound tenses
  if (['present_perfect','pluperfect','future_perfect','perf_subj'].includes(tense)) {
    const realPPx = pp(vk);
    const estarForms = {
      present_perfect: {yo:'estoy',tu:'estás',el:'está',nos:'estamos',vos:'estáis',ellos:'están'},
      pluperfect: {yo:'estaba',tu:'estabas',el:'estaba',nos:'estábamos',vos:'estabais',ellos:'estaban'},
    };
    const serForms = {
      present_perfect: {yo:'soy',tu:'eres',el:'es',nos:'somos',vos:'sois',ellos:'son'},
    };
    if (estarForms[tense]?.[p]) add(hard, (v.refl?RP[p]+' ':'') + estarForms[tense][p] + ' ' + realPPx);
    if (serForms[tense]?.[p]) add(medium, (v.refl?RP[p]+' ':'') + serForms[tense][p] + ' ' + realPPx);
  }

  // 1ab) Mixing up similar-sounding irregular preterit stems (vine/vine, puse/pude, etc.)
  if (tense === 'preterit' && v.irreg) {
    const confusionPairs = [
      ['tener','venir'],['poner','poder'],['saber','caber'],
      ['hacer','decir'],['traer','caer'],['conducir','producir'],
      ['estar','tener'],['querer','poder'],
    ];
    for (const [a,b] of confusionPairs) {
      if (vk === a || v.base === a) { try { add(hard, conj(b, tense, p)); } catch {} }
      if (vk === b || v.base === b) { try { add(hard, conj(a, tense, p)); } catch {} }
    }
  }

  // ══════════════════════════════════════════════════════════════
  // TIER 1.5 — MULTI-TENSE: cross-tense traps from selected set
  // ══════════════════════════════════════════════════════════════
  if (profile === 'multi' && Array.isArray(quizTenses) && quizTenses.length > 1) {
    quizTenses.forEach(tid => {
      if (tid === tense) return;
      try { add(hard, conj(vk, tid, p)); } catch {}
      for (const pp2 of PERSONS) {
        if (pp2.k === p) continue;
        try { add(medium, conj(vk, tid, pp2.k)); } catch {}
      }
    });
  }

  // ══════════════════════════════════════════════════════════════
  // TIER 2 — MEDIUM: plausible but less targeted
  // ══════════════════════════════════════════════════════════════

  // 2a) Every accent position swapped (one at a time)
  const accPairs = {á:'a',é:'e',í:'i',ó:'o',ú:'u',a:'á',e:'é',i:'í',o:'ó',u:'ú'};
  for (let i = 0; i < correct.length; i++) {
    if (accPairs[correct[i]]) {
      add(medium, correct.substring(0, i) + accPairs[correct[i]] + correct.substring(i + 1));
    }
  }

  // 2b) Verbs with the SAME stem change pattern (confuse which verb)
  if (v.sc) {
    const sameSC = vKeys.filter(k => V[k].sc === v.sc && V[k].tp === v.tp);
    for (let i = 0; i < 4 && i < sameSC.length; i++) {
      const rk = sameSC[Math.random() * sameSC.length | 0];
      try { add(medium, conj(rk, tense, p)); } catch {}
    }
  }

  // 2c) Verbs with DIFFERENT stem change (confuse the pattern)
  const otherSC = vKeys.filter(k => V[k].sc && V[k].sc !== (v.sc||'') && V[k].tp === v.tp);
  for (let i = 0; i < 3 && i < otherSC.length; i++) {
    const rk = otherSC[Math.random() * otherSC.length | 0];
    try { add(medium, conj(rk, tense, p)); } catch {}
  }

  // 2d) Other irregular verbs (confuse irregular patterns)
  if (v.irreg) {
    const otherIrreg = vKeys.filter(k => V[k].irreg && k !== vk);
    for (let i = 0; i < 4 && i < otherIrreg.length; i++) {
      const rk = otherIrreg[Math.random() * otherIrreg.length | 0];
      try { add(medium, conj(rk, tense, p)); } catch {}
    }
  }

  // 2e) Same conjugation type verbs
  const sameType = vKeys.filter(k => V[k].tp === v.tp && !V[k].irreg);
  for (let i = 0; i < 4 && i < sameType.length; i++) {
    const rk = sameType[Math.random() * sameType.length | 0];
    try { add(medium, conj(rk, tense, p)); } catch {}
  }

  // 2f) Spelling-change verbs that look similar
  if (v.sp) {
    const sameSP = vKeys.filter(k => V[k].sp === v.sp);
    sameSP.slice(0, 3).forEach(rk => { try { add(medium, conj(rk, tense, p)); } catch {} });
  }

  // 2g) Partial stem change applied — change vowel but forget the rest
  // e.g. "piensamos" (applied ie to nosotros) or "dormemos" (wrong ending with right stem)
  if (v.sc && tense === 'present') {
    const rawStem = baseKey.replace(/(ar|er|ir)$/, '');
    const allSC = {'e:ie':'ie','o:ue':'ue','e:i':'i','u:ue':'ue'};
    const scVowel = allSC[v.sc];
    if (scVowel) {
      // Apply stem change to ALL persons (including nos/vos where it shouldn't be)
      const tp3 = v.tp;
      const endings = tp3==='ar' ? {nos:'amos',vos:'áis'} : tp3==='er' ? {nos:'emos',vos:'éis'} : {nos:'imos',vos:'ís'};
      const wrongChanged = v.sc==='e:ie' ? rawStem.replace(/(.*)e/,'$1ie') :
                           v.sc==='o:ue' ? rawStem.replace(/(.*)o/,'$1ue') :
                           v.sc==='e:i' ? rawStem.replace(/(.*)e/,'$1i') :
                           rawStem.replace(/(.*)u/,'$1ue');
      if (p === 'nos' || p === 'vos') {
        add(medium, (v.refl?RP[p]+' ':'') + wrongChanged + (endings[p]||''));
      }
    }
  }

  // 2h) Conjugation of a phonetically similar verb
  const phoneSimilar = {
    hablar:['hallar'],comer:['correr','coser'],vivir:['venir'],
    tener:['temer'],poner:['poder'],salir:['subir'],
    dormir:['doler'],sentir:['sentar','servir'],
    pedir:['perder'],volver:['volar'],contar:['cantar'],
    pensar:['pesar'],cerrar:['crear'],ser:['ver'],
    estar:['echar'],dar:['ir'],saber:['caber'],
    hacer:['hallar'],decir:['decidir'],querer:['creer'],
    leer:['llegar'],seguir:['servir'],vestir:['venir','ver']
  };
  const similar = phoneSimilar[vk] || phoneSimilar[v.base] || [];
  similar.forEach(sk => {
    const found = Object.keys(V).find(k => V[k].inf === sk);
    if (found) { try { add(medium, conj(found, tense, p)); } catch {} }
  });

  // 2i) Wrong preterit stem for -ducir verbs (conduc- instead of conduj-)
  if (tense === 'preterit' && baseKey.endsWith('ucir')) {
    const badStem = baseKey.replace(/cir$/, 'c');
    const e = {yo:'í',tu:'iste',el:'ió',nos:'imos',vos:'isteis',ellos:'ieron'};
    if (e[p]) add(medium, (v.refl?RP[p]+' ':'') + badStem + e[p]);
  }

  // 2j) Future tense treated as present+infinitive ("yo hablar" kind of nonsense, but more subtly)
  // Student uses infinitive with present ending: "hablaro" / "comeré" on wrong stem
  if (tense === 'future') {
    const wrongE = {yo:'o',tu:'as',el:'a',nos:'amos',vos:'áis',ellos:'an'};
    const futStem2 = (it?.futStem || baseKey);
    if (wrongE[p]) add(medium, (v.refl?RP[p]+' ':'') + futStem2 + wrongE[p]);
  }

  // 2k) Reflexive: pronoun attached vs separated confusion (progressive/command style errors in simple tenses)
  if (v.refl && ['present','preterit','imperfect','future','conditional','pres_subj'].includes(tense)) {
    const stripped = correct.replace(/^(me|te|se|nos|os)\s+/, '');
    // Pronoun stuck to end (command-style error in non-command tense)
    add(medium, stripped + RP[p]);
  }

  // 2l) Adjacent person confusion — él↔ellos, tú↔él (single letter/sound difference)
  const adjacentPersons = {yo:['tu','el'],tu:['yo','el'],el:['tu','ellos','nos'],nos:['vos','el'],vos:['nos','ellos'],ellos:['el','nos']};
  (adjacentPersons[p]||[]).forEach(ap => {
    try { add(medium, conj(vk, tense, ap)); } catch {}
  });

  // ══════════════════════════════════════════════════════════════
  // TIER 2.5 — NEAR-MISSES: surgical 1-2 character errors
  // ══════════════════════════════════════════════════════════════
  const nearMiss = [
    // Ending swaps within same tense family
    s => s.replace(/([aeiou])([ns])$/, '$1'),         // drop final n/s
    s => s.replace(/(amos|emos|imos)$/, m => ({'amos':'emos','emos':'imos','imos':'amos'}[m]||m)),
    s => s.replace(/(aste|iste)$/, m => m==='aste'?'iste':'aste'),
    s => s.replace(/(asteis|isteis)$/, m => m==='asteis'?'isteis':'asteis'),
    s => s.replace(/(aron|ieron)$/, m => m==='aron'?'ieron':'aron'),
    s => s.replace(/(aba|ía)$/, m => m==='aba'?'ía':'aba'),
    s => s.replace(/(abas|ías)$/, m => m==='abas'?'ías':'abas'),
    s => s.replace(/(aban|ían)$/, m => m==='aban'?'ían':'aban'),
    // Accent placement errors
    s => s.replace(/(é|í|ó|á|ú)$/, m => ({é:'e',í:'i',ó:'o',á:'a',ú:'u'}[m]||m)),
    s => s.replace(/([aeiou])$/, m => ({a:'á',e:'é',i:'í',o:'ó',u:'ú'}[m]||m)),
    // Conditional/future contamination
    s => s.replace(/(aría|ería|iría)$/, 'ía'),
    s => s.replace(/ía$/, 'iría'),
    s => s.replace(/é$/, 'e'),
    s => s.replace(/ó$/, 'o'),
    // Command direction swap
    s => s.replace(/^no\s+/, ''),
    s => 'no ' + s,
    // Spelling near-misses
    s => s.replace(/qu/g, 'c'),   // busqué → buscé
    s => s.replace(/gü/g, 'gu'),  // averigüé → averigue
    s => s.replace(/gu(?=[ei])/g, 'g'),  // llegué → llegé
    s => s.replace(/c(?=[ei])/g, 'z'),   // empecé → empezé
    s => s.replace(/z(?=[ei])/g, 'c'),   // reverse
    // Double letter errors
    s => s.replace(/ll/g, 'l'),
    s => s.replace(/rr/g, 'r'),
    // Common letter transpositions
    s => s.replace(/ei/g, 'ie'),
    s => s.replace(/ie/g, 'ei'),
    // -er/-ir endings in present (emos↔imos, éis↔ís)
    s => s.replace(/éis$/, 'ís'),
    s => s.replace(/ís$/, 'éis'),
    // Progressive: swap -ando/-iendo
    s => s.replace(/ando\b/, 'iendo'),
    s => s.replace(/iendo\b/, 'ando'),
  ];
  nearMiss.forEach(tw => {
    const r = tw(correct);
    if (r !== correct) add(profile === 'single' ? medium : soft, r);
  });

  // ══════════════════════════════════════════════════════════════
  // TIER 3 — SOFT: synthetic fallback tweaks
  // ══════════════════════════════════════════════════════════════
  const tweaks = [
    s => s + 'n', s => s + 's', s => s.slice(0, -1),
    s => s.replace(/a$/, 'e'), s => s.replace(/e$/, 'a'),
    s => s.replace(/o$/, 'a'), s => s.replace(/ía$/, 'ia'),
    s => s.replace(/amos$/, 'emos'), s => s.replace(/emos$/, 'imos'),
  ];
  tweaks.forEach(tw => add(soft, tw(correct)));

  // ══════════════════════════════════════════════════════════════
  // ASSEMBLE: prioritize hard → medium → soft
  // ══════════════════════════════════════════════════════════════
  const final = [...hard, ...shuffle(medium), ...shuffle(soft)];
  const out = [];
  for (const cand of final) {
    if (!out.includes(cand)) out.push(cand);
    if (out.length >= n) break;
  }

  // Last resort fill
  while (out.length < n) {
    const rk = vKeys[Math.random() * vKeys.length | 0];
    try {
      const f = conj(rk, tense, p);
      if (isValidConj(f) && f !== correct && !out.includes(f)) { out.push(f); continue; }
    } catch {}
    out.push(`${correct}${['s','n','a'][out.length % 3]}`);
  }
  return out.slice(0, n);
}

// ═══════════════════════════════════════════════════════════════════
function lesson(tid) {
  const L = {
present:{t:'El Presente',sec:[
{h:'Overview',tx:'The present tense describes current actions, habits, and general truths.'},
{h:'-AR Verbs',tx:'Drop -ar, add: -o, -as, -a, -amos, -áis, -an\n\nhablar → hablo, hablas, habla, hablamos, habláis, hablan'},
{h:'-ER Verbs',tx:'Drop -er, add: -o, -es, -e, -emos, -éis, -en\n\ncomer → como, comes, come, comemos, coméis, comen'},
{h:'-IR Verbs',tx:'Drop -ir, add: -o, -es, -e, -imos, -ís, -en\n\nvivir → vivo, vives, vive, vivimos, vivís, viven'},
{h:'Stem-Changing (Boot)',tx:'Stem vowel changes in yo, tú, él, ellos:\n\ne→ie: pensar → pienso, piensas, piensa, pensamos, pensáis, piensan\no→ue: dormir → duermo, duermes, duerme, dormimos, dormís, duermen\ne→i: pedir → pido, pides, pide, pedimos, pedís, piden'},
{h:'Yo-Irregulars',tx:'tengo, vengo, digo, salgo, pongo, hago, traigo, oigo, caigo, valgo, sé, conozco, etc.'},
],vbs:['hablar','comer','vivir','pensar','dormir','pedir','tener','ser','estar','conocer']},

preterit:{t:'El Pretérito',sec:[
{h:'Overview',tx:'Completed past actions with clear start/end.'},
{h:'-AR Verbs',tx:'-é, -aste, -ó, -amos, -asteis, -aron'},
{h:'-ER/-IR Verbs',tx:'-í, -iste, -ió, -imos, -isteis, -ieron'},
{h:'Stem Changes',tx:'Only -IR verbs, only 3rd person: e→i, o→u\n\npedir: pidió, pidieron\ndormir: durmió, durmieron'},
{h:'Irregulars',tx:'Many common verbs have special stems:\n\ntener→tuve, estar→estuve, hacer→hice/hizo, poder→pude, poner→puse, saber→supe, venir→vine, querer→quise, decir→dije, traer→traje\n\nser/ir: fui, fuiste, fue, fuimos, fuisteis, fueron'},
],vbs:['hablar','comer','tener','hacer','ir','ser','dormir','pedir']},

imperfect:{t:'El Imperfecto',sec:[
{h:'Overview',tx:'Ongoing/habitual past, background, descriptions.'},
{h:'-AR Verbs',tx:'-aba, -abas, -aba, -ábamos, -abais, -aban'},
{h:'-ER/-IR Verbs',tx:'-ía, -ías, -ía, -íamos, -íais, -ían'},
{h:'Only 3 Irregulars',tx:'ser: era, eras, era, éramos, erais, eran\nir: iba, ibas, iba, íbamos, ibais, iban\nver: veía, veías, veía, veíamos, veíais, veían'},
],vbs:['hablar','comer','vivir','ser','ir','ver']},

future:{t:'El Futuro Simple',sec:[
{h:'Formation',tx:'Infinitive + -é, -ás, -á, -emos, -éis, -án'},
{h:'Irregular Stems',tx:'tener→tendr-, venir→vendr-, salir→saldr-, poner→pondr-, hacer→har-, decir→dir-, poder→podr-, saber→sabr-, querer→querr-, caber→cabr-'},
],vbs:['hablar','tener','hacer','poder','salir']},

conditional:{t:'El Condicional',sec:[
{h:'Formation',tx:'Infinitive + -ía, -ías, -ía, -íamos, -íais, -ían'},
{h:'Irregular Stems',tx:'Same as future: tendr-, har-, podr-, etc.'},
],vbs:['hablar','tener','hacer','poder']},

present_perfect:{t:'Pretérito Perfecto',sec:[
{h:'Formation',tx:'he/has/ha/hemos/habéis/han + past participle (-ado/-ido)\n\nIrregular participles: dicho, hecho, visto, escrito, abierto, muerto, puesto, vuelto, roto, frito, cubierto'},
],vbs:['hablar','hacer','ver','escribir','decir']},

pluperfect:{t:'Pluscuamperfecto',sec:[
{h:'Formation',tx:'había/habías/había/habíamos/habíais/habían + past participle'},
],vbs:['hablar','hacer','ver']},

future_perfect:{t:'Futuro Perfecto',sec:[
{h:'Formation',tx:'habré/habrás/habrá/habremos/habréis/habrán + past participle'},
],vbs:['hablar','hacer','terminar']},

conditional_perfect:{t:'Condicional Perfecto',sec:[
{h:'Formation',tx:'habría/habrías/habría/habríamos/habríais/habrían + past participle'},
],vbs:['hablar','hacer','ir']},

pres_prog:{t:'Presente Progresivo',sec:[
{h:'Formation',tx:'estoy/estás/está/estamos/estáis/están + gerund (-ando/-iendo)'},
{h:'Irregular Gerunds',tx:'diciendo, viniendo, durmiendo, muriendo, pidiendo, sirviendo, siguiendo, leyendo, oyendo, trayendo, cayendo, yendo, construyendo'},
],vbs:['hablar','comer','dormir','decir','leer']},

past_prog:{t:'Pasado Progresivo',sec:[
{h:'Formation',tx:'estaba/estabas/etc. + gerund'},
],vbs:['hablar','comer','dormir']},

pres_subj:{t:'Presente de Subjuntivo',sec:[
{h:'Formation',tx:'From yo present, drop -o, add opposite endings:\n-AR → -e, -es, -e, -emos, -éis, -en\n-ER/-IR → -a, -as, -a, -amos, -áis, -an'},
{h:'Irregulars',tx:'sea, esté, vaya, haya, sepa, dé\nFrom yo-go: tenga, venga, diga, salga, ponga, haga, traiga, oiga, caiga'},
],vbs:['hablar','comer','tener','ser','ir','saber']},

perf_subj:{t:'Perfecto de Subjuntivo',sec:[
{h:'Formation',tx:'haya/hayas/haya/hayamos/hayáis/hayan + past participle'},
],vbs:['hablar','hacer','ver']},

aff_cmd:{t:'Mandatos Afirmativos',sec:[
{h:'Tú',tx:'Use él present form. Irregulars: di, haz, ve, pon, sal, sé, ten, ven'},
{h:'Usted/Ustedes',tx:'Use subjunctive forms'},
{h:'Nosotros',tx:'Use subjunctive (Let\'s...). ir → vamos'},
{h:'Vosotros',tx:'Infinitive drop -r, add -d'},
],vbs:['hablar','hacer','decir','ir','poner','tener']},

neg_cmd:{t:'Mandatos Negativos',sec:[
{h:'All Persons',tx:'no + subjunctive form\n\nno hables, no hable, no hablemos, no habléis, no hablen'},
],vbs:['hablar','hacer','ir','decir']},

  };
  return L[tid] || {t: tenseById(tid)?.name || tid, sec: [{h:'Practice',tx:'Practice this tense!'}], vbs: ['hablar','comer','vivir']};
}

const $ = id => document.getElementById(id);
function render() {
  const app = $('app');
  if (view === 'home') app.innerHTML = rHome();
  else if (view === 'lesson') app.innerHTML = rLesson();
  else if (view === 'quiz') app.innerHTML = rQuiz();
  else if (view === 'custom') app.innerHTML = rCustom();
  else if (view === 'settings') app.innerHTML = rSettings();
  else if (view === 'stats') app.innerHTML = rStats();
  else app.innerHTML = rHome();
  bind();
}

function nav(v) { view = v; render(); scrollTo(0, 0); }

function rHome() {
  const pct = P.tot ? Math.round(P.ok / P.tot * 100) : 0;
  const lvl = Math.floor(P.xp / 100) + 1;
  const cats = {};
  TENSES.forEach(t => { if (!cats[t.cat]) cats[t.cat] = []; cats[t.cat].push(t); });
  let cards = '';
  for (const [cat, ts] of Object.entries(cats)) {
    cards += `<div class="mb-5"><h3 class="text-xs font-bold text-indigo-400 uppercase tracking-widest mb-2">${cat}</h3><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">`;
    ts.forEach(t => {
      const done = P.done.includes(t.id), sc = P.scores[t.id], sp = sc ? Math.round(sc.ok / sc.tot * 100) : 0;
      cards += `<div class="bg-slate-800/50 border border-slate-700/40 rounded-xl p-3 hover:border-indigo-500/60 transition cursor-pointer group" data-nav="lesson" data-tid="${t.id}">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full ${done ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700/50 text-slate-500'}">${done ? '✓ Passed' : 'New'}</span>
          ${sc ? `<span class="text-[10px] font-medium text-amber-400">${sp}%</span>` : ''}
        </div>
        <h4 class="font-semibold text-sm text-white group-hover:text-indigo-300 transition">${t.name}</h4>
        <p class="text-[11px] text-slate-500 mt-0.5">${t.desc}</p>
      </div>`;
    });
    cards += '</div></div>';
  }
  return `<div class="max-w-6xl mx-auto px-4 py-6">
  <div class="flex items-center justify-between mb-5">
    <div><h1 class="text-2xl sm:text-3xl font-black bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">🇪🇸 Conjugation Master</h1>
    <p class="text-slate-500 text-xs mt-0.5">Get ${PASS_STREAK} correct in a row to pass!</p></div>
    <div class="flex gap-1.5">
      <button data-nav="stats" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-xs transition">📊</button>
      <button data-nav="settings" class="p-2 rounded-lg bg-slate-800/80 hover:bg-slate-700 text-xs transition">⚙️</button>
    </div>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-5">
    <div class="bg-indigo-600/20 border border-indigo-500/20 rounded-xl p-3 text-center"><div class="text-xl font-bold text-indigo-300">${lvl}</div><div class="text-[10px] text-indigo-400">Level</div></div>
    <div class="bg-emerald-600/20 border border-emerald-500/20 rounded-xl p-3 text-center"><div class="text-xl font-bold text-emerald-300">${pct}%</div><div class="text-[10px] text-emerald-400">Accuracy</div></div>
    <div class="bg-amber-600/20 border border-amber-500/20 rounded-xl p-3 text-center"><div class="text-xl font-bold text-amber-300">🔥${P.streak}</div><div class="text-[10px] text-amber-400">Current Streak</div></div>
    <div class="bg-pink-600/20 border border-pink-500/20 rounded-xl p-3 text-center"><div class="text-xl font-bold text-pink-300">${P.done.length}/${TENSES.length}</div><div class="text-[10px] text-pink-400">Passed</div></div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 mb-6">
    <button data-action="randomQuiz" class="bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 font-bold py-3 px-4 rounded-xl transition shadow-lg text-sm">🎲 Random Quiz</button>
    <button data-nav="custom" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 font-bold py-3 px-4 rounded-xl transition shadow-lg text-sm">🎯 Custom Quiz</button>
    <button data-action="weakQuiz" class="bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 font-bold py-3 px-4 rounded-xl transition shadow-lg text-sm">💪 Weak Areas</button>

}

function rLesson() {
  const ls = lesson(curTense), t = tenseById(curTense);
  const total = ls.sec.length + 1;
  if (curStep >= ls.sec.length) return rLessonTable(ls, t);
  const sec = ls.sec[curStep], pct = ((curStep + 1) / total) * 100;
  return `<div class="max-w-4xl mx-auto px-4 py-6 fade">
  <div class="flex items-center justify-between mb-4">
    <button data-nav="home" class="text-slate-400 hover:text-white text-sm transition">← Back</button>
    <span class="text-xs text-slate-500">${curStep + 1}/${total}</span>
  </div>
  <div class="w-full bg-slate-800 rounded-full h-1.5 mb-5"><div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-1.5 rounded-full transition-all" style="width:${pct}%"></div></div>
  <div class="bg-slate-800/50 border border-slate-700/40 rounded-2xl p-6 mb-5">
    <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-1">${t?.name || ''}</div>
    <h2 class="text-xl font-bold mb-4">${sec.h}</h2>
    <div class="text-slate-300 leading-relaxed whitespace-pre-line text-sm">${sec.tx}</div>
  </div>
  <div class="flex justify-between">
    <button data-action="prevStep" class="px-5 py-2.5 rounded-xl ${curStep > 0 ? 'bg-slate-700 hover:bg-slate-600' : 'bg-slate-800 text-slate-700 cursor-not-allowed'} transition text-sm font-medium">← Prev</button>
    <button data-action="nextStep" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 transition text-sm font-medium">${curStep < ls.sec.length - 1 ? 'Next →' : 'See Tables →'}</button>
  </div></div>`;
}

function rLessonTable(ls, t) {
  const ps = activePersons().filter(p => t?.id !== 'aff_cmd' && t?.id !== 'neg_cmd' || p.k !== 'yo');
  let tables = '';
  ls.vbs.slice(0, 6).forEach(vk => {
    const v = V[vk]; if (!v) return;
    tables += `<div class="bg-slate-800/50 border border-slate-700/40 rounded-xl p-3 mb-2">
      <h4 class="font-bold text-indigo-300 text-sm mb-2">${v.inf} <span class="text-slate-500 font-normal text-xs">(${v.eng})</span></h4>
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-1">`;
    ps.forEach(pr => {
      try {
        const c = conj(vk, curTense, pr.k);
        if (isValidConj(c)) {
          tables += `<div class="bg-slate-900/50 rounded-lg p-1.5 text-center"><div class="text-[10px] text-slate-600">${pr.l}</div><div class="text-white text-xs font-medium">${c}</div></div>`;
        } else {
          tables += `<div class="bg-slate-900/50 rounded-lg p-1.5 text-center"><div class="text-[10px] text-slate-600">${pr.l}</div><div class="text-slate-700 text-xs">—</div></div>`;
        }
      } catch {
        tables += `<div class="bg-slate-900/50 rounded-lg p-1.5 text-center"><div class="text-[10px] text-slate-600">${pr.l}</div><div class="text-slate-700 text-xs">—</div></div>`;
      }
    });
    tables += '</div></div>';
  });
  return `<div class="max-w-4xl mx-auto px-4 py-6 fade">
  <div class="flex items-center justify-between mb-4">
    <button data-nav="home" class="text-slate-400 hover:text-white text-sm transition">← Back</button>
    <span class="text-xs text-slate-500">Tables</span>
  </div>
  <h2 class="text-lg font-bold mb-3">📋 ${t?.name} — Tables</h2>
  ${tables}
  <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-4 mt-4 mb-4">
    <p class="text-amber-400 text-sm font-medium">🎯 To pass: Get <strong>${PASS_STREAK} correct answers in a row</strong></p>
  </div>
  <div class="flex gap-2">
    <button data-action="prevStep" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-700 hover:bg-slate-600 transition text-sm font-medium">← Lesson</button>
    <button data-action="startTenseQuiz" class="flex-1 px-4 py-2.5 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 transition text-sm font-bold shadow-lg">🚀 Take Quiz</button>
  </div>
  </div>`;
}

function explainConjugation(q) {
  const v = V[q.vk] || {};
  const groupLabel = ({yo:'yo',tu:'tú',el:'él/ella/usted',nos:'nosotros',vos:'vosotros',ellos:'ellos/ustedes'})[q.p] || q.p;
  const isIrreg = !!(getIrregTable(q.vk)?.[q.t] || (v.refl && v.base && getIrregTable(v.base)?.[q.t]));
  const bits = [];

  if (v.gustarLike) {
    const io = IOP[q.p] || 'le';
    bits.push(`This is treated as a gustar-like structure: use indirect object pronoun <strong>${io}</strong> for <strong>${q.pl}</strong>.`);
    bits.push('The verb defaults to 3rd-person singular unless an explicit plural subject is provided.');
  } else {
    bits.push(`Pronoun <strong>${q.pl}</strong> uses the <strong>${groupLabel}</strong> conjugation slot.`);
  }

  const tenseFormula = {
    present:'Present: stem + ending.',
    preterit:'Preterite: completed past form with preterite endings/irregular stem.',
    imperfect:'Imperfect: habitual/ongoing past endings.',
    future:'Future: infinitive + future ending.',
    conditional:'Conditional: infinitive + conditional ending.',
    present_perfect:'Present perfect: <strong>haber (present)</strong> + past participle.',
    pluperfect:'Pluperfect: <strong>haber (imperfect)</strong> + past participle.',
    future_perfect:'Future perfect: <strong>haber (future)</strong> + past participle.',
    conditional_perfect:'Conditional perfect: <strong>haber (conditional)</strong> + past participle.',
    pres_prog:'Present progressive: <strong>estar (present)</strong> + gerund.',
    past_prog:'Past progressive: <strong>estar (imperfect)</strong> + gerund.',
    fut_prog:'Future progressive: <strong>estar (future)</strong> + gerund.',
    cond_prog:'Conditional progressive: <strong>estar (conditional)</strong> + gerund.',
    pres_subj:'Present subjunctive: opposite endings (or irregular stem).',
    past_subj:'Past subjunctive: derived from 3rd person plural preterite.',
    perf_subj:'Present perfect subjunctive: <strong>haya...</strong> + past participle.',
    aff_cmd:'Affirmative command form for this person.',
    neg_cmd:'Negative command: <strong>no + present subjunctive</strong>.',
    ir_a_future:'Periphrastic future: <strong>ir (present) + a + infinitive</strong>.'
  };
  bits.push(tenseFormula[q.t] || 'Tense-specific rule applied.');

  if (['present_perfect','pluperfect','future_perfect','conditional_perfect','perf_subj'].includes(q.t)) {
    bits.push(`Built as helper + participle: <strong>${pp(q.vk)}</strong> is the participle here.`);
  }
  if (['pres_prog','past_prog','fut_prog','cond_prog'].includes(q.t)) {
    bits.push(`Built as estar + gerund: gerund here is <strong>${gerund(q.vk)}</strong>.`);
  }
  if (v.refl) {
    bits.push('This is reflexive, so the reflexive pronoun is required and placed according to tense/command rules.');
  }
  if (isIrreg) {
    bits.push('This verb is irregular in this tense, so a memorized irregular pattern was used.');
  } else if (v.sc && ['present','pres_subj'].includes(q.t)) {
    bits.push(`Stem-change pattern <strong>${v.sc}</strong> applied where appropriate.`);
  }

  bits.push(`Final correct form: <strong>${q.correct}</strong>.`);
  return bits.join(' ');
}

function rQuiz() {
  if (!quiz) return '<div class="p-8 text-center">Loading...</div>';
  if (quiz.passed) return rPassed();
  if (quiz.done) return rResults();
  
  const q = quiz.qs[quiz.ci];
  const v = V[q.vk];
  const tName = tenseById(q.t)?.name || q.t;
  const currentQuestion = Number.isFinite(quiz.ci) ? Math.min(Math.max(quiz.ci + 1, 1), quiz.qs.length) : 1;
  const totalQuestions = Array.isArray(quiz.qs) ? quiz.qs.length : 0;
  const isMultiTenseQuiz = quiz.tids.length > 1;
  
  // Streak display
  const currentTenseTrack = quiz.tenseTrack[q.t] || {streak:0};
  const streakPct = Math.min(100, (currentTenseTrack.streak / PASS_STREAK) * 100);
  
  let fb = '';
  if (quiz.fb) {
    const ok = quiz.lastAns === q.correct;
    const explanation = explainConjugation(q);
    fb = `<div class="mt-4 p-4 rounded-xl ${ok ? 'bg-emerald-500/15 border border-emerald-500/25' : 'bg-red-500/15 border border-red-500/25'} fade">
      <div class="font-bold ${ok ? 'text-emerald-400' : 'text-red-400'}">${ok ? '✅ Correct!' : '❌ Incorrect'}</div>
      ${!ok ? `<div class="text-slate-300 text-sm mt-1">Correct: <span class="font-bold text-emerald-400">${q.correct}</span></div>
      <div class="text-red-400/70 text-xs mt-1">Streak reset to 0</div>` : ''}
      <div class="mt-3 bg-slate-900/35 border border-slate-700/40 rounded-lg p-3">
        <div class="text-[11px] text-slate-400 uppercase tracking-wide mb-1">Why This Form</div>
        <div class="text-xs text-slate-200 leading-relaxed">${explanation}</div>
      </div>
      <button data-action="nextQ" class="mt-3 px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-medium transition">Continue →</button>
    </div>`;
  }
  
  const optButtons = q.opts.map((o, i) => {
    let cls = 'bg-slate-800/50 border border-slate-700/40 hover:border-indigo-500/50 hover:bg-slate-700/50 text-white';
    if (quiz.fb) {
      if (o === q.correct) cls = 'bg-emerald-600/25 border border-emerald-500/40 text-emerald-300';
      else if (o === quiz.lastAns) cls = 'bg-red-600/25 border border-red-500/40 text-red-300';
      else cls = 'bg-slate-800/20 border border-slate-700/20 text-slate-600';
    }
    return `<button data-ans="${i}" class="quiz-btn ${cls} rounded-xl p-3 text-center transition font-medium ${quiz.fb ? 'pointer-events-none' : 'cursor-pointer'}" style="display:flex;align-items:center;justify-content:center;gap:0.5rem">
      <span class="text-slate-500 text-[10px] font-mono" style="min-width:1.2rem;text-align:right;line-height:1">${String.fromCharCode(65 + i)}.</span><span class="text-sm">${o}</span>
    </button>`;
  });
  const dkBtn = `<button data-ans="dk" class="quiz-btn bg-slate-900/30 border border-slate-700/20 hover:border-amber-500/30 rounded-xl p-2 text-center transition text-amber-500/60 hover:text-amber-400 text-xs ${quiz.fb ? 'pointer-events-none opacity-40' : 'cursor-pointer'}">🤷 I don't know</button>`;

  // Determine layout based on option count
  const oc = optButtons.length;
  let optsHtml = '';
  if (oc % 4 === 0 && oc >= 4) {
    // 4 corners: 2-column grid
    optsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem" class="mb-2">${optButtons.join('')}</div>${dkBtn}`;
  } else if (oc % 3 === 0 && oc >= 3 && oc % 4 !== 0) {
    // 3-column grid
    optsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem" class="mb-2">${optButtons.join('')}</div>${dkBtn}`;
  } else if (oc === 2) {
    // 2 columns side by side
    optsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem" class="mb-2">${optButtons.join('')}</div>${dkBtn}`;
  } else if (oc % 5 === 0 && oc >= 5 && oc % 3 !== 0) {
    // 5 sections: top row of 3, bottom row of 2
    const topRow = optButtons.slice(0, 3).join('');
    const botRow = optButtons.slice(3).join('');
    optsHtml = `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.5rem" class="mb-2">${topRow}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;max-width:66%;margin:0 auto" class="mb-2">${botRow}</div>${dkBtn}`;
  } else {
    // Vertical stack (default)
    optsHtml = `<div style="display:grid;gap:0.5rem" class="mb-2">${optButtons.join('')}</div>${dkBtn}`;
  }
  const opts = optsHtml;

  const tenseStatus = quiz.tids.map(tid => {
    const tr = quiz.tenseTrack[tid] || {streak:0};
    const passed = tr.passed || tr.streak >= PASS_STREAK;
    return `<div class="flex items-center justify-between text-[11px] py-1 border-b border-slate-700/20">
      <span class="${passed ? 'text-emerald-400 line-through' : 'text-slate-400'}">${passed ? '✅ ' : ''}${tenseById(tid)?.name || tid}</span>
      <span class="font-semibold ${passed ? 'text-emerald-300' : 'text-amber-400'}">${passed ? 'DONE' : tr.streak+'/'+PASS_STREAK}</span>
    </div>`;
  }).join('');

  const progressPanel = isMultiTenseQuiz
    ? `<div class="mb-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-slate-400">Current streak (${tenseById(q.t)?.name || q.t}): <strong class="text-amber-400">${currentTenseTrack.streak}/${PASS_STREAK}</strong></span>
          ${currentTenseTrack.streak > 0 ? `<span class="text-xs text-amber-400 streak-glow">🔥</span>` : ''}
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2.5 mb-2">
          <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-2.5 rounded-full transition-all duration-300" style="width:${streakPct}%"></div>
        </div>
        <button data-action="toggleTracker" class="w-full flex items-center justify-between bg-slate-900/40 border border-slate-700/30 rounded-xl px-3 py-2 text-xs text-slate-300 hover:bg-slate-800/50 transition">
          <span>Progress To ${PASS_STREAK} (Per Tense)</span>
          <span>${quiz.showTracker ? '▾' : '▸'}</span>
        </button>
        ${quiz.showTracker ? `<div class="mt-2 bg-slate-900/40 border border-slate-700/30 rounded-xl p-3">
          <div class="text-xs text-slate-400 mb-1">Current: <strong class="text-amber-400">${tenseById(q.t)?.name || q.t}</strong> <span class="text-amber-400">${currentTenseTrack.streak}/${PASS_STREAK}</span></div>
          ${tenseStatus}
        </div>` : ''}
      </div>`
    : `<div class="mb-4">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-slate-400">${tenseById(q.t)?.name || q.t} streak: <strong class="text-amber-400">${currentTenseTrack.streak}/${PASS_STREAK}</strong></span>
          ${currentTenseTrack.streak > 0 ? `<span class="text-xs text-amber-400 streak-glow">🔥</span>` : ''}
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2.5">
          <div class="bg-gradient-to-r from-amber-500 to-orange-500 h-2.5 rounded-full transition-all duration-300" style="width:${streakPct}%"></div>
        </div>
      </div>`;

  return `<div class="max-w-3xl mx-auto px-4 py-6 fade">
  <div class="flex items-center justify-between mb-3">
    <button data-action="quitQuiz" class="text-slate-500 hover:text-white text-xs transition">✕ Quit</button>
    <div class="flex items-center gap-3">
      <span class="text-xs text-slate-500 whitespace-nowrap">Q${currentQuestion}/${totalQuestions}</span>
    </div>
  </div>
  
  ${progressPanel}
  
  <div class="bg-slate-800/60 border border-slate-700/40 rounded-2xl p-5 mb-4 slide">
    <div class="flex flex-wrap gap-1.5 mb-3">
      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-300">${tName}</span>
      <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-purple-500/15 text-purple-300">${q.pl}</span>
    </div>
    <h2 class="text-lg font-bold mb-1">Conjugate: <span class="text-indigo-400">${v?.inf || q.vk}</span> <span class="text-slate-500 text-sm font-normal">(${v?.eng || ''})</span></h2>
    <p class="text-slate-400 text-sm">for <span class="font-semibold text-amber-400">${q.pl}</span>${S.showEnglish ? ` <span class="text-slate-600 text-xs">(${q.pe || ''})</span>` : ''}</p>
  </div>
  <div class="mb-3">${opts}</div>
  ${fb}
  </div>`;
}

function rPassed() {
  const status = quiz.tids.map(tid => {
    const tr = quiz.tenseTrack[tid] || {streak: 0};
    return `<div class="flex items-center justify-between text-xs py-1 border-b border-emerald-500/20">
      <span class="text-emerald-200">${tenseById(tid)?.name || tid}</span>
      <span class="text-emerald-300 font-bold">${tr.streak}/${PASS_STREAK}</span>
    </div>`;
  }).join('');
  return `<div class="max-w-3xl mx-auto px-4 py-6 fade">
  <div class="bg-gradient-to-br from-emerald-600/20 to-teal-600/20 border border-emerald-500/40 rounded-2xl p-8 text-center mb-5">

function rResults() {
  const ok = quiz.okCt, tot = quiz.totalAnswered, pct = tot ? Math.round(ok / tot * 100) : 0;
  return `<div class="max-w-3xl mx-auto px-4 py-6 fade">
  <div class="bg-slate-800/60 border border-slate-700/40 rounded-2xl p-8 text-center mb-5">

    <div class="text-indigo-400 text-xs mt-1">+${quiz.xpE || 0} XP</div>

  <div class="grid grid-cols-2 gap-3">

}
