// ═══════════════════════════════════════════════════════════════════
//  STATS
// ═══════════════════════════════════════════════════════════════════
function rStats() {
  let rows = '';
  TENSES.forEach(t => {
    const sc = P.scores[t.id], done = P.done.includes(t.id);
    const pct = sc ? Math.round(sc.ok / sc.tot * 100) : 0;
    const clr = pct >= 80 ? 'bg-emerald-500' : pct >= 60 ? 'bg-amber-500' : pct > 0 ? 'bg-red-500' : 'bg-slate-700';
    rows += `<div class="flex items-center gap-2 py-1.5 border-b border-slate-700/20">
      <span class="w-5 text-center text-xs">${done ? '✅' : '⬜'}</span>
      <span class="flex-1 text-xs text-slate-300">${t.name}</span>
      <div class="w-20 bg-slate-800 rounded-full h-1.5"><div class="${clr} h-1.5 rounded-full" style="width:${pct}%"></div></div>
      <span class="text-[10px] text-slate-500 w-10 text-right">${sc ? pct + '%' : '—'}</span>
    </div>`;
  });
  return `<div class="max-w-3xl mx-auto px-4 py-6 fade">
  <div class="flex items-center justify-between mb-4">
    <button data-nav="home" class="text-slate-400 hover:text-white text-sm transition">← Back</button>
    <h2 class="font-bold">📊 Stats</h2>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-4">
    <div class="bg-slate-800/50 rounded-xl p-3 text-center"><div class="text-lg font-bold text-indigo-300">${Math.floor(P.xp / 100) + 1}</div><div class="text-[10px] text-slate-500">Level</div></div>
    <div class="bg-slate-800/50 rounded-xl p-3 text-center"><div class="text-lg font-bold text-emerald-300">${P.xp}</div><div class="text-[10px] text-slate-500">XP</div></div>
    <div class="bg-slate-800/50 rounded-xl p-3 text-center"><div class="text-lg font-bold text-amber-300">${P.tot}</div><div class="text-[10px] text-slate-500">Questions</div></div>
    <div class="bg-slate-800/50 rounded-xl p-3 text-center"><div class="text-lg font-bold text-pink-300">${P.best}</div><div class="text-[10px] text-slate-500">Best Streak</div></div>
  </div>
  <div class="bg-slate-800/50 border border-slate-700/40 rounded-xl p-4"><h3 class="font-bold text-sm mb-3">Tense Mastery</h3>${rows}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════
//  QUIZ GENERATION
// ═══════════════════════════════════════════════════════════════════
function genQs(tids, count) {
  const qs = [];
  const pros = activePronouns();
  const vks = Object.keys(V);
  const seen = new Set();
  let att = 0;
  
  while (qs.length < count && att < count * 20) {
    att++;
    const tid = tids[Math.random() * tids.length | 0];
    const vk = vks[Math.random() * vks.length | 0];
    const usePros = (tid === 'aff_cmd' || tid === 'neg_cmd') ? pros.filter(p => p.ck !== 'yo') : pros;
    const pr = usePros[Math.random() * usePros.length | 0];
    const key = vk + '-' + tid + '-' + pr.l;
    if (seen.has(key)) continue;
    
    try {
      const correct = conj(vk, tid, pr.ck);
      if (!isValidConj(correct)) continue;
      
      const nc = S.numChoices || 12;
      const nDistractors = nc - 1;
      const profile = tids.length > 1 ? 'multi' : 'single';
      const ds = distractors(vk, tid, pr.ck, correct, nDistractors, profile, tids);
      let opts = [correct, ...ds.slice(0, nDistractors)];
      opts = [...new Set(opts)].filter(o => isValidConj(o));
      while (opts.length < nc) opts.push(correct + ['s', 'n', 'a'][opts.length % 3]);
      const wrongs = opts.filter(o => o !== correct).slice(0, nDistractors);
      let final = shuffle([correct, ...wrongs]);
      seen.add(key);
      qs.push({vk, t: tid, p: pr.ck, pl: pr.l, pe: pr.e, correct, opts: final});
    } catch { continue; }
  }
  return shuffle(qs);
}

// Generate a single question for a specific tense.
function genOneQ(tid) {
  const pros = activePronouns();
  const vks = Object.keys(V);
  const usePros = (tid === 'aff_cmd' || tid === 'neg_cmd') ? pros.filter(p => p.ck !== 'yo') : pros;
  for (let att = 0; att < 200; att++) {
    const vk = vks[Math.random() * vks.length | 0];
    const pr = usePros[Math.random() * usePros.length | 0];
    try {
      const correct = conj(vk, tid, pr.ck);
      if (!isValidConj(correct)) continue;
      const nc = S.numChoices || 12;
      const nDistractors = nc - 1;
      const ds = distractors(vk, tid, pr.ck, correct, nDistractors, 'multi', [tid]);
      let opts = [correct, ...ds.slice(0, nDistractors)];
      opts = [...new Set(opts)].filter(o => isValidConj(o));
      while (opts.length < nc) opts.push(correct + ['s', 'n', 'a'][opts.length % 3]);
      const wrongs = opts.filter(o => o !== correct).slice(0, nDistractors);
      const final = shuffle([correct, ...wrongs]);
      return { vk, t: tid, p: pr.ck, pl: pr.l, pe: pr.e, correct, opts: final };
    } catch { continue; }
  }
  return null;
}

// Given a set of candidate tense IDs, return the one shown longest ago.
function leastRecentAmong(candidates) {
  const recent = quiz.recentTenseHistory || [];
  if (!candidates.length) return null;
  if (candidates.length === 1) return candidates[0];
  // Walk backwards through history; first candidate NOT found = shown longest ago.
  const lastSeen = {};
  candidates.forEach(t => { lastSeen[t] = -1; }); // -1 = never shown
  for (let i = recent.length - 1; i >= 0; i--) {
    if (lastSeen[recent[i]] === -1) lastSeen[recent[i]] = i;
  }
  // Sort by lastSeen ascending (never-seen first, then earliest).
  candidates.sort((a, b) => lastSeen[a] - lastSeen[b]);
  return candidates[0];
}

// Pick next tense for multi-tense quiz based on streak-balancing logic.
function pickNextTense() {
  if (!quiz || quiz.tids.length <= 1) return quiz?.tids?.[0] || null;

  const track = quiz.tenseTrack;
  const recent = quiz.recentTenseHistory || [];

  // Filter out passed tenses (streak >= PASS_STREAK).
  const remaining = quiz.tids.filter(tid => !(track[tid]?.passed));
  if (remaining.length === 0) return null; // all passed
  if (remaining.length === 1) return remaining[0];

  // Sort remaining by streak ascending (lowest first).
  const sorted = [...remaining].sort((a, b) => (track[a]?.streak || 0) - (track[b]?.streak || 0));
  const maxStreak = track[sorted[sorted.length - 1]]?.streak || 0;
  const minStreak = track[sorted[0]]?.streak || 0;

  // Leader(s) = tenses tied at the highest streak.
  const leaders = sorted.filter(tid => (track[tid]?.streak || 0) === maxStreak);
  const nonLeaders = sorted.filter(tid => (track[tid]?.streak || 0) < maxStreak);

  // Everyone tied → pick whichever was shown longest ago, avoid 3 in a row.
  if (nonLeaders.length === 0 || maxStreak === minStreak) {
    const last3 = recent.slice(-3);
    if (last3.length === 3 && last3.every(t => t === last3[0])) {
      return leastRecentAmong(remaining.filter(t => t !== last3[0]));
    }
    return leastRecentAmong(remaining);
  }

  // Count how many consecutive non-leader questions we've shown.
  let consecutiveNonLeader = 0;
  for (let i = recent.length - 1; i >= 0; i--) {
    if (nonLeaders.includes(recent[i])) consecutiveNonLeader++;
    else break;
  }

  // After each non-leader has had 3 turns, give leader(s) a turn.
  if (consecutiveNonLeader >= 3 * nonLeaders.length) {
    return leastRecentAmong(leaders);
  }

  // Within non-leaders, avoid showing the same one 3× in a row.
  const last2 = recent.slice(-2);
  if (last2.length === 2 && last2[0] === last2[1] && nonLeaders.includes(last2[0])) {
    const others = nonLeaders.filter(t => t !== last2[0]);
    if (others.length) return leastRecentAmong(others);
  }

  // Among lowest-streak non-leaders, pick the one shown longest ago.
  const lowestStreak = track[sorted[0]]?.streak || 0;
  const lowestTied = nonLeaders.filter(tid => (track[tid]?.streak || 0) === lowestStreak);
  return leastRecentAmong(lowestTied);
}

// Advance to the next question, dynamically picking tense in multi-mode.
function advanceQuiz() {
  quiz.fb = false;

  if (quiz.tids.length > 1) {
    const tid = pickNextTense();
    if (!tid) { quiz.passed = true; return; } // all tenses passed
    const q = genOneQ(tid);
    if (q) {
      quiz.ci = quiz.qs.length;
      quiz.qs.push(q);
      if (!quiz.recentTenseHistory) quiz.recentTenseHistory = [];
      quiz.recentTenseHistory.push(tid);
      return;
    }
    // Fallback
    quiz.ci++;
    if (quiz.ci >= quiz.qs.length) quiz.done = true;
  } else {
    quiz.ci++;
    if (quiz.ci >= quiz.qs.length - 25 && !quiz.passed) {
      quiz.qs.push(...genQs(quiz.tids, 400));
    }
    if (quiz.ci >= quiz.qs.length) quiz.done = true;
  }
}

function startQuiz(tids) {
  const qs = genQs(tids, 1200);
  if (!qs.length) { alert('No questions could be generated.'); return; }
  const tenseTrack = {};
  tids.forEach(tid => {
    tenseTrack[tid] = { streak: 0, best: 0, passed: false };
  });
  quiz = {
    qs,
    ci: 0,
    okCt: 0,
    totalAnswered: 0,
    overallBestStreak: 0,
    tenseTrack,
    recentTenseHistory: [],
    done: false,
    passed: false,
    showTracker: tids.length === 1,
    fb: false,
    lastAns: null,
    tids,
    xpE: 0
  };
  view = 'quiz';
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  UI SCALE
// ═══════════════════════════════════════════════════════════════════
function applyScale() {
  const scale = Math.max(50, Math.min(200, S.uiScale || 100));
  document.getElementById('app').style.transform = `scale(${scale / 100})`;
  document.getElementById('app').style.transformOrigin = 'top center';
  // Adjust body height so scrolling works correctly with scaled content
  if (scale !== 100) {
    document.getElementById('app').style.marginBottom = `${(scale - 100) * 2}px`;
  } else {
    document.getElementById('app').style.marginBottom = '';
  }
}

// ═══════════════════════════════════════════════════════════════════
//  EVENT BINDING
// ═══════════════════════════════════════════════════════════════════
function bind() {
  document.querySelectorAll('[data-nav]').forEach(el => {
    el.onclick = () => {
      const target = el.dataset.nav;
      if (target === 'lesson') { curTense = el.dataset.tid; curStep = 0; }
      nav(target);
    };
  });
  
  document.querySelectorAll('[data-action]').forEach(el => {
    el.onclick = () => {
      const a = el.dataset.action;
      if (a === 'prevStep') { if (curStep > 0) { curStep--; render(); scrollTo(0, 0); } }
      if (a === 'nextStep') { curStep++; render(); scrollTo(0, 0); }
      if (a === 'startTenseQuiz') { startQuiz([curTense]); }
      if (a === 'randomQuiz') startQuiz(TENSES.map(t => t.id));
      if (a === 'weakQuiz') {
        let weak = TENSES.map(t => ({id: t.id, pct: P.scores[t.id] ? (P.scores[t.id].ok / P.scores[t.id].tot) : 0})).sort((a, b) => a.pct - b.pct).slice(0, 6).map(t => t.id);
        if (!weak.length) weak = TENSES.map(t => t.id);
        startQuiz(weak);
      }
      if (a === 'nextQ') {
        advanceQuiz();
        render();
        scrollTo(0, 0);
      }
      if (a === 'quitQuiz') { if (confirm('Quit?')) nav('home'); }
      if (a === 'retake') { startQuiz(quiz.tids); }
      if (a === 'continueQuiz') { quiz.passed = false; render(); }
      if (a === 'toggleTracker') { quiz.showTracker = !quiz.showTracker; render(); }
      if (a === 'selAll') document.querySelectorAll('.tcb').forEach(c => c.checked = true);
      if (a === 'selNone') document.querySelectorAll('.tcb').forEach(c => c.checked = false);
      if (a === 'launchCustom') {
        const sel = [...document.querySelectorAll('.tcb:checked')].map(c => c.value);
        const autoPassed = !!document.getElementById('include-passed-tenses')?.checked;
        const merged = [...new Set([...sel, ...(autoPassed ? P.done.filter(id => ACTIVE_IDS.has(id)) : [])])];
        if (!merged.length) { alert('Select at least one tense or enable passed lessons auto-add!'); return; }
        startQuiz(merged);
      }
      if (a === 'reset') {
        if (confirm('Erase ALL progress?')) {
          LS.clear();
          P = {done: [], scores: {}, ok: 0, tot: 0, streak: 0, best: 0, xp: 0};
          S = {showVosotros: true, showEnglish: true, quizSize: 20, timedMode: false, timerSec: 15, instantFeedback: true, fontSize: 'normal'};
          CUSTOM_VERBS = {};
          saveCustomVerbs();
          saveP(); saveS();
          nav('home');
        }
      }
      if (a === 'exportAllData') {
        const payload = {
          version: 1,
          exportedAt: new Date().toISOString(),
          settings: S,
          progress: P,
          customVerbs: CUSTOM_VERBS
        };
        const txt = JSON.stringify(payload, null, 2);
        const blob = new Blob([txt], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const aEl = document.createElement('a');
        aEl.href = url;
        aEl.download = `spanish_conjugation_data_${Date.now()}.json`;
        document.body.appendChild(aEl);
        aEl.click();
        aEl.remove();
        URL.revokeObjectURL(url);
      }
      if (a === 'importAllData') {
        const raw = prompt('Paste exported JSON here. This will override current data.');
        if (!raw) return;
        try {
          const data = JSON.parse(raw);
          if (!data || typeof data !== 'object') throw new Error('bad');
          if (data.settings && typeof data.settings === 'object') S = data.settings;
          if (data.progress && typeof data.progress === 'object') P = data.progress;
          if (data.customVerbs && typeof data.customVerbs === 'object') CUSTOM_VERBS = data.customVerbs;

          // keep fixed pass rule cleanup
          if (S.passStreak !== undefined) delete S.passStreak;
          // Backfill new settings fields from older exports
          if (!S.numChoices || S.numChoices < 3) S.numChoices = 12;
          if (!S.uiScale) S.uiScale = 100;

          // Migrate old tense IDs from imported data
          migrateProgress();

          // reload verb runtime from imported custom verbs
          Object.keys(V).forEach(k => {
            if (V[k] && V[k].custom) delete V[k];
          });
          loadCustomVerbsIntoV();

          saveS();
          saveP();
          saveCustomVerbs();
          alert('Data imported and applied (old tenses auto-migrated).');
          render();
        } catch {
          alert('Invalid JSON.');
        }
      }
      if (a === 'importVerbsTxt') {
        const fileInput = document.getElementById('verb-file-input');
        const file = fileInput?.files?.[0];
        if (!file) { alert('Choose a .txt file first.'); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const text = String(reader.result || '');
          const lines = text.split(/\r?\n/);
          let added = 0, skipped = 0;
          lines.forEach(line => {
            const res = addCustomVerbLine(line);
            if (res.added) added++;
            else if (res.reason !== 'empty') skipped++;
          });
          saveCustomVerbs();
          alert(`Imported ${added} verbs. Skipped ${skipped} lines.`);
          render();
        };
        reader.readAsText(file);
      }
      if (a === 'removeCustomVerb') {
        const k = el.dataset.key;
        if (!k || !CUSTOM_VERBS[k]) return;
        delete CUSTOM_VERBS[k];
        if (V[k] && V[k].custom) delete V[k];
        saveCustomVerbs();
        render();
      }
    };
  });
  
  document.querySelectorAll('.quiz-btn').forEach(el => {
    el.onclick = () => {
      if (!quiz || quiz.fb || quiz.done || quiz.passed) return;
      const idx = el.dataset.ans;
      if (idx === 'dk') submitAns('__dk__');
      else { const q = quiz.qs[quiz.ci]; submitAns(q.opts[parseInt(idx)]); }
    };
  });
  
  document.querySelectorAll('.set-cb').forEach(el => {
    el.onchange = () => { S[el.dataset.set] = el.checked; saveS(); };
  });
  document.querySelectorAll('.set-num').forEach(el => {
    el.onchange = () => {
      S[el.dataset.set] = parseInt(el.value);
      saveS();
      if (el.dataset.set === 'uiScale') applyScale();
    };
  });
  applyScale();

  document.querySelectorAll('.custom-gustar').forEach(el => {
    el.onchange = () => {
      const k = el.dataset.key;
      if (!k || !CUSTOM_VERBS[k]) return;
      CUSTOM_VERBS[k].gustarLike = !!el.checked;
      if (V[k]) V[k].gustarLike = !!el.checked;
      saveCustomVerbs();
    };
  });
}

function submitAns(ans) {
  if (!quiz || quiz.fb || quiz.done || quiz.passed) return;
  
  const q = quiz.qs[quiz.ci];
  const ok = ans === q.correct;
  const dk = ans === '__dk__';
  
  quiz.lastAns = dk ? "(don't know)" : ans;
  quiz.totalAnswered++;
  const tTrack = quiz.tenseTrack[q.t] || {streak: 0, best: 0, passed: false};
  quiz.tenseTrack[q.t] = tTrack;
  
  if (ok) {
    quiz.okCt++;
    tTrack.streak++;
    P.ok++;
    P.streak++;

    if (tTrack.streak > tTrack.best) tTrack.best = tTrack.streak;
    if (tTrack.streak >= PASS_STREAK) tTrack.passed = true;
    if (tTrack.streak > quiz.overallBestStreak) quiz.overallBestStreak = tTrack.streak;
    if (P.streak > P.best) P.best = P.streak;

    const xp = 10 + tTrack.streak;
    P.xp += xp;
    quiz.xpE = (quiz.xpE || 0) + xp;

    // Pass only when every selected tense has reached the streak threshold.
    const allPassed = quiz.tids.every(tid => (quiz.tenseTrack[tid]?.streak || 0) >= PASS_STREAK);
    if (allPassed) {
      quiz.passed = true;
      quiz.tids.forEach(tid => {
        if (!P.done.includes(tid)) P.done.push(tid);
      });
    }
  } else {
    tTrack.streak = 0;
    P.streak = 0;
  }
  
  P.tot++;
  
  // Update tense scores
  if (!P.scores[q.t]) P.scores[q.t] = {ok: 0, tot: 0};
  P.scores[q.t].tot++;
  if (ok) P.scores[q.t].ok++;
  
  saveP();
  
  quiz.fb = true;
  render();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (view !== 'quiz' || !quiz || quiz.done || quiz.passed) return;
  if (quiz.fb) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      advanceQuiz();
      render();
      scrollTo(0, 0);
    }
    return;
  }
  const q = quiz.qs[quiz.ci]; if (!q) return;
  const numMap = {'1':0,'2':1,'3':2,'4':3,'5':4,'6':5,'7':6,'8':7,'9':8};
  const alphaMap = {'a':0,'b':1,'c':2,'d':3,'e':4,'f':5,'g':6,'h':7,'i':8,'j':9,'k':10,'l':11};
  const k = e.key.toLowerCase();
  const idx = numMap[k] !== undefined ? numMap[k] : alphaMap[k];
  if (idx !== undefined && idx < q.opts.length) { e.preventDefault(); submitAns(q.opts[idx]); }
  if (e.key === '0') { e.preventDefault(); submitAns('__dk__'); }
});

// ═══════════════════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════════════════
render();

// ── Service Worker for offline caching ──
if ('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'scm-v1';
    self.addEventListener('install', e => {
      e.waitUntil(caches.open(CACHE).then(c => c.addAll(['/'])).catch(()=>{}));
      self.skipWaiting();
    });
    self.addEventListener('activate', e => { self.clients.claim(); });
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {
          const clone = resp.clone();
          caches.open(CACHE).then(c => c.put(e.request, clone)).catch(()=>{});
          return resp;
        })).catch(() => caches.match('/'))
      );
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}
